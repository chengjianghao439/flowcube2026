name: Build Desktop Installer
'on':
  workflow_dispatch:
    inputs:
      version:
        description: 可选。填写如 0.3.2；留空则使用 desktop/package.json 的 version（与 checkout 的 main 上版本一致时最省事）
        required: false
        type: string
      attach_to_github_release:
        description: 构建完成后将 desktop/release/*.exe 上传到已有 GitHub Release（下方填写 release_tag，如 v0.3.13）
        required: false
        type: boolean
        default: false
      release_tag:
        description: 已有 Release 的 tag（仅当勾选 attach_to_github_release 时必填），例如 v0.3.13
        required: false
        type: string
      checkout_ref:
        description: 仅支持 main、main 历史中的完整 SHA 或 v* 版本 tag；运行分支必须为 main。
        required: false
        type: string
      source_run_id:
        description: 恢复发布时填原 tag 构建的 run ID，配合 source_artifact_id 复用原安装包。
        required: false
        type: string
      source_artifact_id:
        description: 原 FlowCube-Desktop-Setup 的精确 artifact ID。恢复时须同时填写 release_tag、checkout_ref 并勾选附件发布。
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - v*
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'flowcube-server-deploy' || 'build-desktop-ci' }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  resolve-release-target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      main_sha: ${{ steps.target.outputs.main_sha }}
      recovery_run: ${{ steps.recovery.outputs.run }}
      recovery_artifact: ${{ steps.recovery.outputs.artifact }}
      recovery_tag: ${{ steps.recovery.outputs.tag }}
    steps:
      - name: Checkout trusted target resolver
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable release target
        id: target
        env:
          RELEASE_CHECKOUT_REF: ${{ github.event.inputs.checkout_ref }}
        run: node scripts/resolve-release-target.cjs
      - name: Verify original Windows artifact for recovery
        id: recovery
        shell: bash
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          ATTACH: ${{ inputs.attach_to_github_release }}
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_RUN" && -z "$SOURCE_ARTIFACT" ]]; then exit 0; fi
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ && "$SOURCE_ARTIFACT" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$CHECKOUT_REF" = "$RELEASE_TAG" && "$ATTACH" = true ]]
          [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA" ]]
          node <<'JS'
          const { validateRecoveryRun } = require('./scripts/publish-release-asset.cjs')
          const { GITHUB_REPOSITORY, GITHUB_TOKEN, RELEASE_TAG, RELEASE_SHA, SOURCE_RUN, SOURCE_ARTIFACT } = process.env
          async function read(api) {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/${api}`, {
              headers: { Authorization: `Bearer ${GITHUB_TOKEN}`, Accept: 'application/vnd.github+json' },
              signal: AbortSignal.timeout(20000),
            })
            if (!response.ok) throw Error(`无法核对恢复来源 HTTP ${response.status}`)
            return response.json()
          }
          ;(async () => {
            validateRecoveryRun(await read(`runs/${SOURCE_RUN}`), { sha: RELEASE_SHA, tag: RELEASE_TAG })
            const artifact = await read(`artifacts/${SOURCE_ARTIFACT}`)
            if (artifact.expired || artifact.name !== 'FlowCube-Desktop-Setup' ||
                String(artifact.workflow_run?.id) !== SOURCE_RUN || artifact.workflow_run?.head_sha !== RELEASE_SHA) {
              throw Error('原桌面产物不属于所选 tag 构建，或已经过期')
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1 })
          JS
          {
            echo "run=$SOURCE_RUN"
            echo "artifact=$SOURCE_ARTIFACT"
            echo "tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"
  build:
    if: needs.resolve-release-target.outputs.recovery_run == ''
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release-target.outputs.sha }}
          persist-credentials: false
      - name: Checkout immutable trusted release tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve-release-target.outputs.main_sha }}
          persist-credentials: false
          path: release-gate-source
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
      - name: Resolve deploy config
        id: deploy_config
        shell: bash
        env:
          ERP_ORIGIN_VAR: ${{ vars.VITE_ERP_PRODUCTION_ORIGIN }}
          SERVER_HOST_VAR: ${{ vars.FLOWCUBE_SERVER_HOST }}
          SERVER_USER_VAR: ${{ vars.FLOWCUBE_SERVER_USER }}
          SERVER_SSH_PORT_VAR: ${{ vars.FLOWCUBE_SERVER_SSH_PORT }}
          SERVER_APP_PATH_VAR: ${{ vars.FLOWCUBE_SERVER_APP_PATH }}
          SERVER_DOWNLOADS_PATH_VAR: ${{ vars.FLOWCUBE_DOWNLOADS_PATH }}
        run: |
          set -euo pipefail
          if node scripts/read-deploy-config.js >/tmp/flowcube-deploy-config.json 2>/tmp/flowcube-deploy-config.err; then
            echo "server_deploy_configured=true" >> "$GITHUB_OUTPUT"
            echo "erp_origin=$(node scripts/read-deploy-config.js erpOrigin)" >> "$GITHUB_OUTPUT"
            echo "server_host=$(node scripts/read-deploy-config.js server.host)" >> "$GITHUB_OUTPUT"
            echo "server_user=$(node scripts/read-deploy-config.js server.user)" >> "$GITHUB_OUTPUT"
            echo "server_ssh_port=$(node scripts/read-deploy-config.js server.sshPort)" >> "$GITHUB_OUTPUT"
            echo "server_app_path=$(node scripts/read-deploy-config.js server.appPath)" >> "$GITHUB_OUTPUT"
            echo "server_downloads_path=$(node scripts/read-deploy-config.js server.downloadsPath)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ERP_ORIGIN="${ERP_ORIGIN_VAR:-}"
          if [ -z "$ERP_ORIGIN" ]; then
            echo "::error::缺少部署配置：桌面安装包必须注入 VITE_ERP_PRODUCTION_ORIGIN，避免默认连到 localhost。请设置 deploy/production.local.json 或 GitHub Variable VITE_ERP_PRODUCTION_ORIGIN。"
            cat /tmp/flowcube-deploy-config.err || true
            exit 1
          fi
          SERVER_HOST="${SERVER_HOST_VAR:-$(node -e "const u=new URL(process.argv[1]); console.log(u.hostname)" "$ERP_ORIGIN")}"
          SERVER_USER="${SERVER_USER_VAR:-root}"
          SERVER_SSH_PORT="${SERVER_SSH_PORT_VAR:-22}"
          SERVER_APP_PATH="${SERVER_APP_PATH_VAR:-/opt/flowcube}"
          SERVER_DOWNLOADS_PATH="${SERVER_DOWNLOADS_PATH_VAR:-/var/www/flowcube-downloads}"
          echo "server_deploy_configured=true" >> "$GITHUB_OUTPUT"
          echo "erp_origin=$ERP_ORIGIN" >> "$GITHUB_OUTPUT"
          echo "server_host=$SERVER_HOST" >> "$GITHUB_OUTPUT"
          echo "server_user=$SERVER_USER" >> "$GITHUB_OUTPUT"
          echo "server_ssh_port=$SERVER_SSH_PORT" >> "$GITHUB_OUTPUT"
          echo "server_app_path=$SERVER_APP_PATH" >> "$GITHUB_OUTPUT"
          echo "server_downloads_path=$SERVER_DOWNLOADS_PATH" >> "$GITHUB_OUTPUT"
      - name: Print commit info
        shell: bash
        run: |
          echo "Commit SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
      - name: DEBUG — step start marker (after checkout)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== START step: post-checkout DEBUG ==="
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-}"
          echo "GITHUB_REF=${GITHUB_REF:-}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME:-}"
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME:-}"
          pwd
          ls -la
          echo "=== END step: post-checkout DEBUG ==="
      - name: Print workflow info
        run: |
          Write-Host "=== START step: Print workflow info ==="
          Write-Host "========================================"
          Write-Host "  FlowCube — DESKTOP BUILD (Electron)"
          Write-Host "  (desktop workflow only)"
          Write-Host "========================================"
          Write-Host "Running Desktop Build Workflow"
          Write-Host "Ref: ${{ github.ref }}"
          Write-Host "Ref name: ${{ github.ref_name }}"
          Write-Host "Event: ${{ github.event_name }}"
          Write-Host "SHA: ${{ github.sha }}"
          Write-Host "========================================"
          Write-Host "=== END step: Print workflow info ==="
          Get-Location
          Get-ChildItem | Select-Object Name, Mode
      - name: DEBUG — after Print workflow info
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DEBUG checkpoint: after Print workflow info ==="
          pwd
          ls -la
      - name: Show directories
        run: |
          Write-Host "=== START step: Show directories ==="
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Directories:"
          Get-ChildItem -Directory | Select-Object Name
          Write-Host "=== END step: Show directories ==="
          Get-Location
          Get-ChildItem | Select-Object Name, Mode
      - name: Check frontend exists
        run: |
          Write-Host "=== START step: Check frontend exists ==="
          if (Test-Path "frontend") {
            Write-Host "frontend/ exists"
            Get-ChildItem "frontend" | Select-Object Name
          } else {
            Write-Host "ERROR: frontend/ not found"
            exit 1
          }
          Write-Host "=== END step: Check frontend exists ==="
          Get-Location
          Get-ChildItem | Select-Object Name, Mode
      - name: Check desktop exists
        run: |
          Write-Host "=== START step: Check desktop exists ==="
          if (Test-Path "desktop") {
            Write-Host "desktop/ exists"
            Get-ChildItem "desktop" | Select-Object Name
          } else {
            Write-Host "ERROR: desktop/ not found"
            exit 1
          }
          Write-Host "=== END step: Check desktop exists ==="
          Get-Location
          Get-ChildItem | Select-Object Name, Mode
      - name: DEBUG — before Setup Node.js
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DEBUG checkpoint: immediately BEFORE actions/setup-node ==="
          pwd
          ls -la
          test -d frontend && ls -la frontend | head -20
          test -d desktop && ls -la desktop | head -20
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: DEBUG — after Setup Node.js
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DEBUG checkpoint: immediately AFTER actions/setup-node ==="
          node -v
          npm -v
          pwd
          ls -la
      - name: Resolve version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            INPUT="$REQUESTED_VERSION"
            if [[ -z "${INPUT// }" ]]; then
              VERSION="$(node -p "require('./desktop/package.json').version")"
              TAG="v${VERSION}"
            else
              VERSION="${INPUT#v}"
              TAG="v${VERSION}"
            fi
          else
            VERSION="$(node -p "require('./desktop/package.json').version")"
            TAG="v${VERSION}"
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=$TAG (event=$EVENT ref=$REF_NAME)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release version"; exit 1; }
          PKG_VERSION="$(node -p "require('./desktop/package.json').version")"
          [ "$VERSION" = "$PKG_VERSION" ] || { echo '::error::发布版本必须匹配实际检出代码的 package.json，不能只重命名安装包'; exit 1; }
          if [[ "$ATTACH_TO_RELEASE" == 'true' ]]; then
            RELEASE_TAG="$REQUESTED_RELEASE_TAG"
            [ "$RELEASE_TAG" = "$TAG" ] || { echo '::error::补传 Release tag 必须匹配实际安装包版本'; exit 1; }
            [ "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)" ] || { echo '::error::Release tag 与实际构建提交不一致'; exit 1; }
          fi
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          ATTACH_TO_RELEASE: ${{ github.event.inputs.attach_to_github_release }}
          REQUESTED_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      - name: Verify desktop/package.json matches Git tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "require('./desktop/package.json').version")"
          if [[ "$TAG_VER" != "$PKG_VER" ]]; then
            echo "::error::Git tag v${TAG_VER} 与 desktop/package.json 的 version (${PKG_VER}) 不一致，禁止构建发版"
            exit 1
          fi
          echo "OK: tag 与 package.json 均为 $PKG_VER"
      - name: Install frontend dependencies
        working-directory: ./frontend
        shell: bash
        run: |
          set -euo pipefail
          echo "=== STEP: Install frontend — START ==="
          pwd
          ls -la
          test -f package-lock.json || { echo "ERROR: frontend/package-lock.json 缺失，请提交 lock 文件"; exit 1; }
          node -e "const p=require('./package.json'); console.log('@vitejs/plugin-legacy in package.json =', p.devDependencies?.['@vitejs/plugin-legacy'])"
          npm ci
          echo "=== STEP: Install frontend — END (success) ==="
          pwd
          ls -la
      - name: DEBUG — after Install frontend
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DEBUG checkpoint: after npm install (frontend) ==="
          pwd
          ls -la
          ls -la frontend | head -30
      - name: Build frontend for Electron
        working-directory: ./frontend
        shell: bash
        env:
          VITE_ELECTRON: 1
          VITE_ERP_PRODUCTION_ORIGIN: ${{ steps.deploy_config.outputs.erp_origin }}
        run: |
          set -euo pipefail
          echo "=== STEP: Build frontend — START (npm run build) ==="
          pwd
          ls -la
          npm run build
          echo "=== STEP: Build frontend — END (success) ==="
          pwd
          ls -la
          ls -la dist | head -20
      - name: DEBUG — after Build frontend
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DEBUG checkpoint: after frontend build ==="
          pwd
          ls -la frontend/dist | head -30
      - name: Log frontend dist after build
        run: |
          Write-Host "=== START step: Log frontend dist ==="
          Write-Host "=== dir frontend\dist (desktop renderer build) ==="
          if (Test-Path "frontend\dist") {
            dir frontend\dist
            Get-ChildItem -Path frontend\dist -Recurse -File | Measure-Object | ForEach-Object { Write-Host "Total files: $($_.Count)" }
          } else {
            Write-Host "ERROR: frontend\dist missing"
            exit 1
          }
          Write-Host "=== END step: Log frontend dist ==="
          Get-Location
          Get-ChildItem | Select-Object Name, Mode
      - name: Install desktop dependencies
        working-directory: ./desktop
        shell: bash
        run: |
          set -euo pipefail
          echo "=== STEP: Install desktop — START ==="
          pwd
          ls -la
          test -f package-lock.json || { echo "ERROR: desktop/package-lock.json 缺失"; exit 1; }
          npm ci
          echo "=== STEP: Install desktop — END (success) ==="
          pwd
          ls -la
      - name: DEBUG — after Install desktop
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DEBUG checkpoint: after npm install (desktop) ==="
          pwd
          ls -la desktop | head -30
      - name: Verify desktop main.js is current (bundle marker)
        shell: bash
        run: |
          set -euo pipefail
          grep -q '当前 main.js 已加载' desktop/main.js || { echo 'ERROR: desktop/main.js 缺少打包验证日志，避免打入旧主进程'; exit 1; }
          echo 'OK: main.js 包含「当前 main.js 已加载」标记'
      - name: Prepare fixed NSIS 3.0.4.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "$env:RUNNER_TEMP\nsis-3.0.4.1.7z"
          $dir = "$env:RUNNER_TEMP\nsis-3.0.4.1"
          Invoke-WebRequest -Uri "https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z" -OutFile $archive
          if (Test-Path $dir) {
            Remove-Item -Recurse -Force $dir
          }
          node release-gate-source/scripts/verify-nsis-archive.cjs $archive
          if ($LASTEXITCODE -ne 0) { throw "NSIS archive integrity check failed" }
          7z x -y $archive "-o$dir"
          if (-not (Test-Path "$dir\Bin\makensis.exe")) {
            throw "Fixed NSIS package missing Bin\\makensis.exe"
          }
          "ELECTRON_BUILDER_NSIS_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using fixed NSIS from $dir"
      - name: Build desktop installer
        working-directory: ./desktop
        shell: bash
        env:
          VITE_ELECTRON: 1
          VITE_ERP_PRODUCTION_ORIGIN: ${{ steps.deploy_config.outputs.erp_origin }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GITHUB_SHA: ${{ needs.resolve-release-target.outputs.sha }}
        run: |
          set -euo pipefail
          echo "=== STEP: Build desktop — START (npm run dist:win) ==="
          pwd
          ls -la
          npm run dist:win
          test "$(cat .git-build-sha)" = "$(git rev-parse HEAD)"
          echo "=== STEP: Build desktop — END (success) ==="
          pwd
          ls -la
          ls -la release | head -30
      - name: Verify embedded application icon
        shell: bash
        run: node scripts/verify-desktop-icon.cjs "desktop/release/win-unpacked/极序 Flow.exe"
      - name: Verify exe exists
        run: |
          Write-Host "=== Verify exe exists (desktop/release/*.exe) ==="
          $exes = @(Get-ChildItem -Path "desktop/release" -Filter "*.exe" -ErrorAction SilentlyContinue)
          if ($exes.Count -eq 0) {
            Write-Host "❌ 未在 desktop/release 下发现任何 .exe"
            exit 1
          }
          Write-Host "✅ exe 已生成 ($($exes.Count) 个)"
          $exes | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
      - name: Verify installer runtime is NSIS 3.04
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "desktop/release" -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) {
            throw "No installer exe found for runtime verification"
          }
          $content = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe.FullName))
          if ($content -notmatch "Nullsoft Install System v3.04") {
            throw "Installer runtime is not NSIS v3.04"
          }
          Write-Host "✅ Verified NSIS runtime v3.04 in $($exe.Name)"
      - name: DEBUG — after Build desktop (dist:win)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DEBUG checkpoint: after dist:win ==="
          pwd
          ls -la desktop/release
      - name: Log desktop release after build
        run: |
          Write-Host "=== START step: Log desktop release ==="
          Write-Host "=== dir desktop\release (NSIS / electron-builder output) ==="
          if (Test-Path "desktop\release") {
            dir desktop\release
            Get-ChildItem -Path desktop\release -Filter "*.exe" | ForEach-Object { Write-Host "EXE: $($_.Name) ($($_.Length) bytes)" }
          } else {
            Write-Host "ERROR: desktop\release missing"
            exit 1
          }
          Write-Host "=== END step: Log desktop release ==="
          Get-Location
          Get-ChildItem | Select-Object Name, Mode
      - name: Rename output files (remove spaces)
        working-directory: ./desktop
        run: |
          Write-Host "=== START step: Rename output files ==="
          Get-ChildItem -Path release -Filter "*.exe" | ForEach-Object {
            $newName = $_.Name -replace ' ', '-'
            if ($_.Name -ne $newName) {
              Move-Item $_.FullName "release/$newName" -Force
              Write-Host "Renamed: $($_.Name) -> $newName"
            }
          }
          Get-ChildItem -Path release -Filter "*.zip" | ForEach-Object {
            $newName = $_.Name -replace ' ', '-'
            if ($_.Name -ne $newName) {
              Move-Item $_.FullName "release/$newName" -Force
              Write-Host "Renamed: $($_.Name) -> $newName"
            }
          }
          Write-Host "=== END step: Rename output files ==="
          Get-Location
          Get-ChildItem release | Select-Object Name, Length
      - name: Prepare installer provenance
        shell: bash
        env:
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
        run: |-
          set -euo pipefail
          mkdir -p out
          cp desktop/release/*.exe out/
          notes="docs/release-notes/${{ steps.version.outputs.version }}.md"
          if [ -f "$notes" ]; then cp "$notes" out/releaseNotes.md; fi
          node release-gate-source/scripts/release-artifact-manifest.cjs write out .exe
      - name: Upload artifacts
        id: exe_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: FlowCube-Desktop-Setup
          path: out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Detect portable ZIP artifact
        id: portable_zip
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(desktop/release/*.zip)
          if [ "${#files[@]}" -gt 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No portable ZIP artifact generated; skipping ZIP artifact upload."
          fi
      - name: DEBUG — before upload-artifact (exe)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DEBUG checkpoint: before Upload Windows Setup EXE artifact ==="
          pwd
          ls -la desktop/release
      - name: Upload portable ZIP artifact (optional)
        if: steps.portable_zip.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        continue-on-error: true
        with:
          name: FlowCube-Desktop-Portable
          path: desktop/release/*.zip
          if-no-files-found: error
          retention-days: 7
    needs: resolve-release-target
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact_id: ${{ steps.exe_artifact.outputs.artifact-id }}
  publish:
    needs:
      - resolve-release-target
      - build
    if: ${{ !cancelled() && needs.resolve-release-target.result == 'success' && (needs.build.result == 'success' || needs.resolve-release-target.outputs.recovery_run != '') && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: flowcube-release-desktop
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout immutable trusted release tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve-release-target.outputs.main_sha }}
          persist-credentials: false
      - name: Download exact installer artifact
        if: needs.resolve-release-target.outputs.recovery_run == ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: desktop/release
          merge-multiple: true
      - name: Download exact original installer for recovery
        if: needs.resolve-release-target.outputs.recovery_run != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.resolve-release-target.outputs.recovery_artifact }}
          run-id: ${{ needs.resolve-release-target.outputs.recovery_run }}
          github-token: ${{ github.token }}
          path: desktop/release
          merge-multiple: true
      - name: Verify installer SHA, run and bytes
        id: artifact
        shell: bash
        env:
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
          ORIGINAL_RUN_ID: ${{ needs.resolve-release-target.outputs.recovery_run || github.run_id }}
        run: |-
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs')
          const { verifyArtifact } = require('./scripts/release-artifact-manifest.cjs')
          const artifact = verifyArtifact('desktop/release', '.exe', process.env.TARGET_SHA, process.env.ORIGINAL_RUN_ID)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `file=desktop/release/${artifact.file}\nsha256=${artifact.sha256}\n`)
          JS
      - name: Resolve verified release version
        id: version
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          RECOVERY_TAG: ${{ needs.resolve-release-target.outputs.recovery_tag }}
        run: |-
          set -euo pipefail
          if [ -n "$RECOVERY_TAG" ]; then VERSION="${RECOVERY_TAG#v}"; TAG="$RECOVERY_TAG"; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG" = "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Resolve deploy config
        id: deploy_config
        shell: bash
        env:
          ERP_ORIGIN_VAR: ${{ vars.VITE_ERP_PRODUCTION_ORIGIN }}
          SERVER_HOST_VAR: ${{ vars.FLOWCUBE_SERVER_HOST }}
          SERVER_USER_VAR: ${{ vars.FLOWCUBE_SERVER_USER }}
          SERVER_SSH_PORT_VAR: ${{ vars.FLOWCUBE_SERVER_SSH_PORT }}
          SERVER_APP_PATH_VAR: ${{ vars.FLOWCUBE_SERVER_APP_PATH }}
          SERVER_DOWNLOADS_PATH_VAR: ${{ vars.FLOWCUBE_DOWNLOADS_PATH }}
        run: |
          set -euo pipefail
          if node scripts/read-deploy-config.js >/tmp/flowcube-deploy-config.json 2>/tmp/flowcube-deploy-config.err; then
            echo "server_deploy_configured=true" >> "$GITHUB_OUTPUT"
            echo "erp_origin=$(node scripts/read-deploy-config.js erpOrigin)" >> "$GITHUB_OUTPUT"
            echo "server_host=$(node scripts/read-deploy-config.js server.host)" >> "$GITHUB_OUTPUT"
            echo "server_user=$(node scripts/read-deploy-config.js server.user)" >> "$GITHUB_OUTPUT"
            echo "server_ssh_port=$(node scripts/read-deploy-config.js server.sshPort)" >> "$GITHUB_OUTPUT"
            echo "server_app_path=$(node scripts/read-deploy-config.js server.appPath)" >> "$GITHUB_OUTPUT"
            echo "server_downloads_path=$(node scripts/read-deploy-config.js server.downloadsPath)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ERP_ORIGIN="${ERP_ORIGIN_VAR:-}"
          if [ -z "$ERP_ORIGIN" ]; then
            echo "::error::缺少部署配置：桌面安装包必须注入 VITE_ERP_PRODUCTION_ORIGIN，避免默认连到 localhost。请设置 deploy/production.local.json 或 GitHub Variable VITE_ERP_PRODUCTION_ORIGIN。"
            cat /tmp/flowcube-deploy-config.err || true
            exit 1
          fi
          SERVER_HOST="${SERVER_HOST_VAR:-$(node -e "const u=new URL(process.argv[1]); console.log(u.hostname)" "$ERP_ORIGIN")}"
          SERVER_USER="${SERVER_USER_VAR:-root}"
          SERVER_SSH_PORT="${SERVER_SSH_PORT_VAR:-22}"
          SERVER_APP_PATH="${SERVER_APP_PATH_VAR:-/opt/flowcube}"
          SERVER_DOWNLOADS_PATH="${SERVER_DOWNLOADS_PATH_VAR:-/var/www/flowcube-downloads}"
          echo "server_deploy_configured=true" >> "$GITHUB_OUTPUT"
          echo "erp_origin=$ERP_ORIGIN" >> "$GITHUB_OUTPUT"
          echo "server_host=$SERVER_HOST" >> "$GITHUB_OUTPUT"
          echo "server_user=$SERVER_USER" >> "$GITHUB_OUTPUT"
          echo "server_ssh_port=$SERVER_SSH_PORT" >> "$GITHUB_OUTPUT"
          echo "server_app_path=$SERVER_APP_PATH" >> "$GITHUB_OUTPUT"
          echo "server_downloads_path=$SERVER_DOWNLOADS_PATH" >> "$GITHUB_OUTPUT"
      - name: Require SSH deploy
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SSH_PRIVATE_KEY" ] || { echo '::error::桌面发布需要服务器 SSH 配置'; exit 1; }
      - name: Wait for checks before publishing installer
        if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 30
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
        run: GITHUB_SHA="$TARGET_SHA" node scripts/wait-release-checks.js
      - name: Connect SSH over WireGuard
        id: ssh_trust
        uses: ./.github/actions/release-ssh
        with:
          host: ${{ steps.deploy_config.outputs.server_host }}
          port: ${{ steps.deploy_config.outputs.server_ssh_port }}
          known-hosts: ${{ vars.FLOWCUBE_SSH_KNOWN_HOSTS }}
          wireguard-endpoint: ${{ vars.FLOWCUBE_WG_ENDPOINT }}
          wireguard-server-public-key: ${{ vars.FLOWCUBE_WG_SERVER_PUBLIC_KEY }}
          wireguard-server-ip: ${{ vars.FLOWCUBE_WG_SERVER_IP }}
          wireguard-client-ip: ${{ vars.FLOWCUBE_WG_CLIENT_IP }}
          wireguard-private-key: ${{ secrets.FLOWCUBE_WG_PRIVATE_KEY }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Publish EXE to canonical download directory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_ARTIFACT_ID: ${{ needs.resolve-release-target.outputs.recovery_artifact || needs.build.outputs.artifact_id }}
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DESKTOP_ARTIFACT: ${{ steps.artifact.outputs.file }}
          DESKTOP_ARTIFACT_SHA: ${{ steps.artifact.outputs.sha256 }}
          ATTACH_DESKTOP_RELEASE: ${{ github.ref_type == 'tag' || inputs.attach_to_github_release }}
          ERP_ORIGIN: ${{ steps.deploy_config.outputs.erp_origin }}
          SERVER_HOST: ${{ steps.deploy_config.outputs.server_host }}
          SERVER_USER: ${{ steps.deploy_config.outputs.server_user }}
          SERVER_SSH_PORT: ${{ steps.deploy_config.outputs.server_ssh_port }}
          SERVER_DOWNLOADS_PATH: ${{ steps.deploy_config.outputs.server_downloads_path }}
        run: |
          set -euo pipefail
          notes_file="desktop/release/releaseNotes.md"
          if [ -f "$notes_file" ]; then
            RELEASE_NOTES_B64="$(node -e "process.stdout.write(Buffer.from(require('fs').readFileSync(process.argv[1], 'utf8')).toString('base64'))" "$notes_file")"
          else
            RELEASE_NOTES_B64="$(node -e "process.stdout.write(Buffer.from(process.argv[1]).toString('base64'))" "极序 Flow v${RELEASE_VERSION} 已发布，包含本次 main 分支更新。")"
          fi
          export RELEASE_NOTES_B64
          bash scripts/publish-desktop-workflow.sh
