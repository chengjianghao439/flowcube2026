name: Server Diagnostics (read-only)

# 只读服务器诊断：从 CI 出口 IP 经 SSH 收集内存 / 磁盘 / 容器 / OOM 等现场信息，只回显到 CI 日志。
#
# 为什么需要它（2026-09-19）：本机为盘点做了 30+ 次独立短 SSH 连接、多次被本地 timeout 强杀，
# 把自己的出口 IP 打到服务器 sshd 限流（banner 阶段超时）——而同一时刻 CI 出口 IP 完全正常
# （`Add SSH known_hosts` 成功）。诊断能力不应绑在某一个来源 IP 上，因此把只读诊断放进 CI。
#
# **本 workflow 只能读，不能改**：不删除、不重启、不清理、不迁移。`tests/deployment-resources.test.js`
# 会机械断言这一点（远程脚本里出现删除/重启/清理类命令即测试失败），改这里前先看那条断言。

on:
  workflow_dispatch:
    inputs:
      top_n:
        description: '进程 TOP N（按 RSS）'
        required: false
        default: '12'
      du_paths:
        description: '额外统计占用的绝对路径（空格分隔，仅做只读统计）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # 独立并发组：只读诊断不改动服务器状态，因此不需要也不应该占用部署组（否则会把部署挤成 pending）。
  group: flowcube-server-diagnostics
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Resolve deploy config
        id: deploy_config
        shell: bash
        env:
          ERP_ORIGIN_VAR: ${{ vars.VITE_ERP_PRODUCTION_ORIGIN }}
          SERVER_HOST_VAR: ${{ vars.FLOWCUBE_SERVER_HOST }}
          SERVER_USER_VAR: ${{ vars.FLOWCUBE_SERVER_USER }}
          SERVER_SSH_PORT_VAR: ${{ vars.FLOWCUBE_SERVER_SSH_PORT }}
          SERVER_APP_PATH_VAR: ${{ vars.FLOWCUBE_SERVER_APP_PATH }}
        run: |
          set -euo pipefail
          if node scripts/read-deploy-config.js >/tmp/flowcube-deploy-config.json 2>/tmp/flowcube-deploy-config.err; then
            {
              echo "erp_origin=$(node scripts/read-deploy-config.js erpOrigin)"
              echo "server_host=$(node scripts/read-deploy-config.js server.host)"
              echo "server_user=$(node scripts/read-deploy-config.js server.user)"
              echo "server_ssh_port=$(node scripts/read-deploy-config.js server.sshPort)"
              echo "server_app_path=$(node scripts/read-deploy-config.js server.appPath)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ERP_ORIGIN="${ERP_ORIGIN_VAR:-}"
          [ -n "$ERP_ORIGIN" ] || { echo "::error::缺少部署配置：设置 deploy/production.local.json 或 GitHub Variable VITE_ERP_PRODUCTION_ORIGIN"; cat /tmp/flowcube-deploy-config.err || true; exit 1; }
          SERVER_HOST="${SERVER_HOST_VAR:-$(node -e "const u=new URL(process.argv[1]); console.log(u.hostname)" "$ERP_ORIGIN")}"
          SERVER_USER="${SERVER_USER_VAR:-root}"
          SERVER_SSH_PORT="${SERVER_SSH_PORT_VAR:-22}"
          SERVER_APP_PATH="${SERVER_APP_PATH_VAR:-/opt/flowcube}"
          {
            echo "erp_origin=$ERP_ORIGIN"
            echo "server_host=$SERVER_HOST"
            echo "server_user=$SERVER_USER"
            echo "server_ssh_port=$SERVER_SSH_PORT"
            echo "server_app_path=$SERVER_APP_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Setup SSH agent
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::缺少 Actions Secret: SSH_PRIVATE_KEY"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE=~/.ssh/flowcube_ci_key
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add "$KEY_FILE"

      - name: Add SSH known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H -p "${{ steps.deploy_config.outputs.server_ssh_port }}" "${{ steps.deploy_config.outputs.server_host }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Collect read-only diagnostics
        shell: bash
        env:
          TOP_N: ${{ inputs.top_n }}
          DU_PATHS: ${{ inputs.du_paths }}
          APP_PATH: ${{ steps.deploy_config.outputs.server_app_path }}
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            -p "${{ steps.deploy_config.outputs.server_ssh_port }}" \
            "${{ steps.deploy_config.outputs.server_user }}@${{ steps.deploy_config.outputs.server_host }}" \
            "TOP_N='$TOP_N' DU_PATHS='$DU_PATHS' APP_PATH='$APP_PATH' bash -s" <<'REMOTE'
          set -uo pipefail

          echo "=========== 主机与负载 ==========="
          hostname; uptime; who -b 2>/dev/null
          echo "nproc=$(nproc)  mem_total_mb=$(awk '/MemTotal/{printf "%.0f", $2/1024}' /proc/meminfo)"

          echo "=========== 内存 ==========="
          free -m
          grep -E 'MemTotal|MemAvailable|Cached|SwapTotal|SwapFree|Dirty|Slab|SReclaimable|Committed_AS' /proc/meminfo

          echo "=========== 进程 TOP ${TOP_N}（按 RSS）==========="
          ps -eo pid,rss,pcpu,pmem,comm,args --sort=-rss | head -n "$((TOP_N + 1))"

          echo "=========== 按进程聚合 RSS（前 8 名命令）==========="
          ps -eo rss,comm --no-headers | awk '{a[$2]+=$1} END {for (k in a) printf "%.0f MB\t%s\n", a[k]/1024, k}' | sort -rn | head -8

          echo "=========== 容器状态 ==========="
          docker ps --format '{{.Names}}	{{.Status}}	{{.Image}}'

          echo "=========== 容器内存（docker stats 采样一次，上限 30 秒）==========="
          timeout 30 docker stats --no-stream --format '{{.Name}}	{{.MemUsage}}	{{.MemPerc}}	{{.CPUPerc}}' 2>/dev/null || echo '(docker stats 超时或不可用)'

          echo "=========== 容器 cgroup 内存 ==========="
          for id in $(docker ps -q 2>/dev/null); do
            name=$(docker inspect -f '{{.Name}}' "$id" 2>/dev/null)
            for p in "/sys/fs/cgroup/system.slice/docker-${id}.scope/memory.current" "/sys/fs/cgroup/memory/docker/${id}/memory.usage_in_bytes"; do
              if [ -r "$p" ]; then
                echo "${name} $(awk -v b="$(cat "$p" 2>/dev/null)" 'BEGIN {printf "%.0f MB", b/1048576}')"
                break
              fi
            done
          done

          echo "=========== OOM / 被杀进程记录 ==========="
          dmesg -T 2>/dev/null | grep -iE 'oom|killed process' | tail -10 || echo '(dmesg 无相关记录或不可读)'
          journalctl --since '48 hours ago' --no-pager 2>/dev/null | grep -iE 'oom-kill|killed process|out of memory' | tail -10 || echo '(journal 无相关记录)'

          echo "=========== 磁盘 ==========="
          df -h
          echo "--- 一级目录占用 ---"
          for p in /var/lib/docker /var/lib/docker/overlay2 /var/lib/docker/volumes /var/log /tmp "$APP_PATH" /var/www/flowcube-downloads $DU_PATHS; do
            [ -e "$p" ] && du -sh "$p" 2>/dev/null
          done | sort -rh

          echo "=========== 应用目录明细 ==========="
          echo "--- $APP_PATH ---"
          du -sh "$APP_PATH"/* 2>/dev/null | sort -rh | head -10
          echo "--- .git / node_modules ---"
          du -sh "$APP_PATH/.git" "$APP_PATH/backend/node_modules" 2>/dev/null
          echo "--- 下载目录 ---"
          du -sh /var/www/flowcube-downloads/* 2>/dev/null | sort -rh | head -10

          echo "=========== docker 镜像 / 卷统计 ==========="
          docker image ls --format '{{.Repository}}:{{.Tag}}	{{.Size}}' 2>/dev/null | head -25
          echo "flowcube 标签总数: $(docker image ls --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | grep -c '^flowcube-')"
          echo "悬空镜像数: $(docker image ls -f dangling=true -q 2>/dev/null | wc -l)"
          echo "卷数量: $(docker volume ls -q 2>/dev/null | wc -l)"

          echo "=========== /var/log 明细 ==========="
          du -sh /var/log/* 2>/dev/null | sort -rh | head -8

          echo "=========== 只读诊断结束（本次未对服务器做任何修改）==========="
          REMOTE
