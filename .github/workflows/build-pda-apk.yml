# Manual release only. No push, workflow_run or workflow_call publication.
name: Build PDA APK
'on':
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 必须填写 main 历史中完整的 40 位 SHA；不接受分支、标签或短 SHA。
        required: true
        type: string
      approval_comment_id:
        description: 老大在 GitHub 回复 发 加完整 SHA 的评论 ID。
        required: true
        type: string
      backup_comment_id:
        description: 同一主题内，运维先提交的备份就绪评论 ID。
        required: true
        type: string
permissions:
  contents: read
  actions: read
  issues: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  resolve-release-target:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      main_sha: ${{ github.workflow_sha }}
      artifact_id: ${{ steps.checks.outputs.artifact-id }}
    steps:
      - name: Checkout immutable trusted release tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate immutable release target
        id: target
        env:
          RELEASE_MANUAL_ONLY: '1'
          RELEASE_CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: node scripts/resolve-release-target.cjs
      - name: Verify GitHub approval, Tests and actual npm audit jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
          BACKUP_COMMENT_ID: ${{ inputs.backup_comment_id }}
          RELEASE_CHECKS_OUTPUT: checks.json
        run: node scripts/manual-release/verify-gates.cjs
      - name: Retain verified gate evidence
        id: checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manual-release-checks
          path: checks.json
          retention-days: 7
          if-no-files-found: error
  build-pda:
    needs:
      - resolve-release-target
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.target.outputs.version }}
      version_code: ${{ steps.target.outputs.version_code }}
      artifact_id: ${{ steps.apk_artifact.outputs.artifact-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve-release-target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable trusted release tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve-release-target.outputs.main_sha }}
          persist-credentials: false
          path: release-gate-source
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
      - name: Validate public PDA origin
        env:
          PDA_ORIGIN: ${{ vars.VITE_ERP_PRODUCTION_ORIGIN }}
        run: >-
          node -e 'const u=new URL(process.env.PDA_ORIGIN);
          if(u.protocol!=="https:"||u.username||u.password||u.pathname!=="/"||u.search||u.hash)process.exit(1)'
      - name: Resolve target commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="$(node -p "require('./backend/apk/version.json').version")"
          version_code="$(node -p "require('./backend/apk/version.json').versionCode")"
          {
            echo "sha=${sha}"
            echo "version=${version}"
            echo "version_code=${version_code}"
          } >> "$GITHUB_OUTPUT"
          echo "目标提交：${sha}（触发事件 ${{ github.event_name }}，触发 SHA ${{ github.sha }}）"
          echo "目标版本：${version} / ${version_code}"
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Sync Capacitor Android project
        working-directory: ./frontend
        env:
          VITE_CAPACITOR: 1
          VITE_ERP_PRODUCTION_ORIGIN: ${{ vars.VITE_ERP_PRODUCTION_ORIGIN }}
        run: npm run pda:sync
      - name: Test Android native scanner
        working-directory: ./frontend/android
        run: ./gradlew :app:testDebugUnitTest
      - name: Build release APK
        working-directory: ./frontend/android
        run: ./gradlew clean assembleRelease
      - name: Verify APK version
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK_PATH"
          EXPECTED_NAME="$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path('frontend/android/app/build.gradle').read_text()
          m = re.search(r'versionName\s+"([^"]+)"', text)
          print(m.group(1) if m else '')
          PY
          )"
          EXPECTED_CODE="$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path('frontend/android/app/build.gradle').read_text()
          m = re.search(r'versionCode\s+(\d+)', text)
          print(m.group(1) if m else '')
          PY
          )"
          test -n "$EXPECTED_NAME"
          test -n "$EXPECTED_CODE"
          APKANALYZER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name apkanalyzer | head -n 1)"
          test -n "$APKANALYZER"
          ACTUAL_NAME="$("$APKANALYZER" manifest version-name "$APK_PATH")"
          ACTUAL_CODE="$("$APKANALYZER" manifest version-code "$APK_PATH")"
          echo "Expected versionName=$EXPECTED_NAME versionCode=$EXPECTED_CODE"
          echo "Actual   versionName=$ACTUAL_NAME versionCode=$ACTUAL_CODE"
          test "$ACTUAL_NAME" = "$EXPECTED_NAME"
          test "$ACTUAL_CODE" = "$EXPECTED_CODE"

          # build.gradle 与 backend/apk/version.json 必须一致：前者是 APK 内置版本，
          # 后者是后端对 PDA 公布的版本，PDA 拿两者比对决定是否更新。此前无人校验，
          # 导致 version.json 长期停在旧版本、APK 每次都在更新却从不被下载。
          JSON_NAME="$(node -p "require('./backend/apk/version.json').version")"
          JSON_CODE="$(node -p "require('./backend/apk/version.json').versionCode")"
          echo "version.json versionName=$JSON_NAME versionCode=$JSON_CODE"
          if [ "$JSON_NAME" != "$EXPECTED_NAME" ] || [ "$JSON_CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::backend/apk/version.json ($JSON_NAME/$JSON_CODE) 与 build.gradle ($EXPECTED_NAME/$EXPECTED_CODE) 不一致；PDA 将无法正确检测更新。请用 bump-version.sh 同步版本号。"
            exit 1
          fi
      - name: Rename APK
        run: |
          mkdir -p out
          VERSION="$(node -p "require('./backend/apk/version.json').version")"
          cp frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk "out/FlowCubePDA-${VERSION}.apk"

          cp backend/apk/version.json out/version.json
      - name: Bind unsigned APK provenance
        env:
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
        run: node release-gate-source/scripts/release-artifact-manifest.cjs write out .apk
      - name: Upload APK artifact
        id: apk_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flowcube-pda-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 7
    timeout-minutes: 35
  sign-pda:
    needs:
      - resolve-release-target
      - build-pda
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      artifact_id: ${{ steps.signed_apk.outputs.artifact-id }}
    steps:
      - name: Checkout immutable trusted release tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve-release-target.outputs.main_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Recheck boss approval and current gates before signing secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
          APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
          BACKUP_COMMENT_ID: ${{ inputs.backup_comment_id }}
          RELEASE_CHECKS_OUTPUT: signing-checks.json
        run: node scripts/manual-release/verify-gates.cjs
      - name: Download exact unsigned APK artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.build-pda.outputs.artifact_id }}
          path: unsigned
          merge-multiple: true
      - name: Verify unsigned APK SHA, run and bytes
        env:
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
        run: node scripts/release-artifact-manifest.cjs verify unsigned .apk
      - name: Select trusted Android signing tools
        run: |-
          set -euo pipefail
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
      - name: Sign APK in fresh runner
        shell: bash
        env:
          PDA_SIGNING_KEYSTORE_BASE64: ${{ secrets.PDA_SIGNING_KEYSTORE_BASE64 }}
          PDA_SIGNING_STORE_PASSWORD: ${{ secrets.PDA_SIGNING_STORE_PASSWORD }}
          PDA_SIGNING_KEY_ALIAS: ${{ secrets.PDA_SIGNING_KEY_ALIAS }}
          PDA_SIGNING_KEY_PASSWORD: ${{ secrets.PDA_SIGNING_KEY_PASSWORD }}
        run: >-
          set -euo pipefail

          key="$RUNNER_TEMP/flowcube-release.keystore"

          trap 'rm -f "$key" "$RUNNER_TEMP/flowcube-aligned.apk"' EXIT

          test -n "$PDA_SIGNING_KEYSTORE_BASE64"

          printf '%s' "$PDA_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$key"

          chmod 600 "$key"

          shopt -s nullglob

          files=(unsigned/*.apk)

          test "${#files[@]}" -eq 1

          mkdir -p out

          signed_apk="out/$(basename "${files[0]}")"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "${files[0]}" "$RUNNER_TEMP/flowcube-aligned.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$key" --ks-key-alias "$PDA_SIGNING_KEY_ALIAS" --ks-pass
          env:PDA_SIGNING_STORE_PASSWORD --key-pass env:PDA_SIGNING_KEY_PASSWORD --out "$signed_apk"
          "$RUNNER_TEMP/flowcube-aligned.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$signed_apk"

          # APK delivery does not use incremental-install V4 sidecars. Remove only

          # the regular sidecar this signing invocation generated; all other entries fail provenance.

          if [[ -e "$signed_apk.idsig" || -L "$signed_apk.idsig" ]]; then
            test -f "$signed_apk.idsig" && test ! -L "$signed_apk.idsig"
            rm -- "$signed_apk.idsig"
          fi

          cp unsigned/version.json out/version.json
      - name: Bind signed APK provenance
        env:
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
        run: node scripts/release-artifact-manifest.cjs write out .apk
      - name: Download verified gate evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.resolve-release-target.outputs.artifact_id }}
          path: gate
          merge-multiple: true
      - name: Package signed APK and complete source identity
        env:
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
        run: >-
          mkdir -p payload

          cp out/*.apk payload/app.apk

          cp out/version.json payload/version.json

          git worktree add --detach "$RUNNER_TEMP/pda-source" "$TARGET_SHA"

          python3 -B scripts/manual-release/make-bundle.py pda "$RUNNER_TEMP/pda-source" payload gate/checks.json
          "$RUNNER_TEMP/release.tar"
      - name: Upload signed full release bundle
        id: signed_apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pda-release-bundle
          path: ${{ runner.temp }}/release.tar
          retention-days: 7
          if-no-files-found: error
    environment: manual-release
    timeout-minutes: 40
  publish-pda:
    needs:
      - resolve-release-target
      - sign-pda
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 215
    environment: manual-release
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    concurrency:
      group: flowcube-server-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout immutable trusted release tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Recheck live GitHub gates and authenticated approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
          APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
          BACKUP_COMMENT_ID: ${{ inputs.backup_comment_id }}
          RELEASE_CHECKS_OUTPUT: current-checks.json
        run: node scripts/manual-release/verify-gates.cjs
      - name: Download this run exact release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.sign-pda.outputs.artifact_id }}
          path: bundle
          merge-multiple: true
      - name: Verify target SHA, locks and full bundle before secrets
        env:
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
        run: python3 -B scripts/manual-release/verify-local.py bundle/release.tar verified current-checks.json
      - name: Direct restricted SSH transfer from GitHub runner
        env:
          FLOWCUBE_SSH_HOST: ${{ vars.FLOWCUBE_SERVER_HOST }}
          FLOWCUBE_SSH_PORT: ${{ vars.FLOWCUBE_SERVER_SSH_PORT }}
          FLOWCUBE_RELEASE_USER: ${{ vars.FLOWCUBE_RELEASE_USER }}
          FLOWCUBE_SSH_KNOWN_HOSTS: ${{ vars.FLOWCUBE_SSH_KNOWN_HOSTS }}
          FLOWCUBE_RELEASE_SSH_KEY: ${{ secrets.FLOWCUBE_RELEASE_SSH_KEY }}
        run: python3 -B scripts/manual-release/send-bundle.py bundle/release.tar
