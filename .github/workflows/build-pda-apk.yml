name: Build PDA APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-pda-apk.yml'
      - 'frontend/**'
      - 'backend/apk/version.json'
      - 'backend/src/modules/pda/**'
      - 'docker-compose.yml'
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: '可选。补跑某次发布提交时填它的 SHA（留空 = 当前分支 HEAD）。必须在那个提交上已有成功的浏览器部署。'
        required: false
        type: string

permissions:
  contents: read
  actions: read

# 并发划分（2026-09-18 结构性重构）：
# **workflow 级不再持有部署组。** 旧结构把 build job 整体挂在 `flowcube-server-deploy` 组下，
# 而该 job 内含「等本提交浏览器部署成功」——浏览器部署同样要这个组，于是构成自锁：
# PDA 等浏览器部署、浏览器部署等 PDA 释放组，表现是 `Deploy Browser App` 长期 pending
# （v0.9.23 实操，见 docs/release-v0.9.23-result.md）。互等时 GitHub 不报错，只是干等。
# 现在按「临界区」拆成三段，等待与持锁不再同处一个 job：
#   - build-pda   只构建，走独立的 `build-pda-ci` 组（新提交可取消旧构建，不碰服务器锁）
#   - wait-browser 只等待浏览器部署，**不占任何部署组**
#   - publish-pda  只有这一步占用 `flowcube-server-deploy`（与 deploy-browser / build-desktop 串行）
# 服务器端 flock 仍保留为兜底。publish 阶段用 artifact 承接构建产物。

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # 前置门（2026-09-18 加入）：
  #  ① 版本清单一致性——`backend/apk/version.json` 与 `frontend/android/app/build.gradle`
  #     必须在构建前就一致（v0.9.19 就是发布提交先推、清单同步提交在后，PDA 构建白跑
  #     4 分钟才在「Verify APK version」失败）。
  #  ② 目标版本是否已发布——已发布的 versionCode 不允许换成不同字节的安装包
  #     （`scripts/publish-pda.sh` 会拒绝，客户端也不会因为同 versionCode 更新）。发版后再动
  #     `frontend/**` 或本工作流文件会触发这个构建，旧行为是白构建 4 分钟再红；现在直接跳过。
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.inputs.checkout_ref || github.sha }}

      - name: 版本清单一致性（构建前快失败）
        shell: bash
        run: |
          set -euo pipefail
          JSON_NAME="$(node -p "require('./backend/apk/version.json').version")"
          JSON_CODE="$(node -p "require('./backend/apk/version.json').versionCode")"
          GRADLE_NAME="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' frontend/android/app/build.gradle | head -1)"
          GRADLE_CODE="$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' frontend/android/app/build.gradle | head -1)"
          echo "version.json=${JSON_NAME}/${JSON_CODE} build.gradle=${GRADLE_NAME}/${GRADLE_CODE}"
          if [ "$JSON_NAME" != "$GRADLE_NAME" ] || [ "$JSON_CODE" != "$GRADLE_CODE" ]; then
            echo "::error::backend/apk/version.json 与 build.gradle 不一致，PDA 无法正确检测更新；请用 bump-version.sh 一次性同步三端与 PDA 版本后再发版。"
            exit 1
          fi

      - name: 目标版本是否已发布
        id: gate
        shell: bash
        env:
          ERP_ORIGIN_VAR: ${{ vars.VITE_ERP_PRODUCTION_ORIGIN }}
        run: |
          set -euo pipefail
          target_name="$(node -p "require('./backend/apk/version.json').version")"
          target_code="$(node -p "require('./backend/apk/version.json').versionCode")"
          origin="${ERP_ORIGIN_VAR:-}"
          [ -n "$origin" ] || origin="$(node scripts/read-deploy-config.js erpOrigin 2>/dev/null || true)"
          if [ -z "$origin" ]; then
            echo "无法确定生产 origin，按需要构建处理（后续发布步骤会自行校验）。"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          live="$(curl -fsSL -H 'Cache-Control: no-cache' "${origin%/}/api/pda/version?_=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || true)"
          live_name="$(printf '%s' "$live" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).data?.version||'')}catch{console.log('')}})")"
          live_code="$(printf '%s' "$live" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).data?.versionCode||'')}catch{console.log('')}})")"
          echo "目标 ${target_name}/${target_code} · 线上已发布 ${live_name:-未知}/${live_code:-未知}"
          if [ "$live_name" = "$target_name" ] && [ "$live_code" = "$target_code" ]; then
            echo "该版本（${target_name} / versionCode ${target_code}）已经发布，跳过本次构建。"
            echo "同一 versionCode 不允许换成不同字节的安装包（客户端不会因此更新）；需要新安装包请先提升版本号。"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  # 只负责构建并把 APK 交给 artifact；不等待任何部署、不持有服务器锁。
  build-pda:
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    # 独立的构建组：只影响构建本身。新提交取消旧构建是安全的——产物尚未发布，
    # 且每次构建都从指定提交重新出包。绝不与部署组共用，避免又引入互等。
    concurrency:
      group: build-pda-ci
      cancel-in-progress: true
    outputs:
      # 后续 job 的「等浏览器部署」「服务器 HEAD 校验」都以实际检出的提交为准。
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.target.outputs.version }}
      version_code: ${{ steps.target.outputs.version_code }}
      artifact_id: ${{ steps.apk_artifact.outputs.artifact-id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # 手动补跑可以显式指定发布提交；留空时用本次触发的提交（push = 该次推送，dispatch = 所选 ref 的 HEAD）。
          ref: ${{ github.event.inputs.checkout_ref || github.sha }}
          fetch-depth: 0

      - name: Resolve target commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="$(node -p "require('./backend/apk/version.json').version")"
          version_code="$(node -p "require('./backend/apk/version.json').versionCode")"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "目标提交：${sha}（触发事件 ${{ github.event_name }}，触发 SHA ${{ github.sha }}）"
          echo "目标版本：${version} / ${version_code}"

      - name: Resolve deploy config
        id: deploy_config
        shell: bash
        env:
          ERP_ORIGIN_VAR: ${{ vars.VITE_ERP_PRODUCTION_ORIGIN }}
          SERVER_HOST_VAR: ${{ vars.FLOWCUBE_SERVER_HOST }}
          SERVER_USER_VAR: ${{ vars.FLOWCUBE_SERVER_USER }}
          SERVER_SSH_PORT_VAR: ${{ vars.FLOWCUBE_SERVER_SSH_PORT }}
          SERVER_APP_PATH_VAR: ${{ vars.FLOWCUBE_SERVER_APP_PATH }}
        run: |
          set -euo pipefail
          if node scripts/read-deploy-config.js >/tmp/flowcube-deploy-config.json 2>/tmp/flowcube-deploy-config.err; then
            echo "erp_origin=$(node scripts/read-deploy-config.js erpOrigin)" >> "$GITHUB_OUTPUT"
            echo "server_host=$(node scripts/read-deploy-config.js server.host)" >> "$GITHUB_OUTPUT"
            echo "server_user=$(node scripts/read-deploy-config.js server.user)" >> "$GITHUB_OUTPUT"
            echo "server_ssh_port=$(node scripts/read-deploy-config.js server.sshPort)" >> "$GITHUB_OUTPUT"
            echo "server_app_path=$(node scripts/read-deploy-config.js server.appPath)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ERP_ORIGIN="${ERP_ORIGIN_VAR:-}"
          [ -n "$ERP_ORIGIN" ] || { echo "::error::缺少部署配置：设置 deploy/production.local.json 或 GitHub Variable VITE_ERP_PRODUCTION_ORIGIN"; cat /tmp/flowcube-deploy-config.err || true; exit 1; }
          SERVER_HOST="${SERVER_HOST_VAR:-$(node -e "const u=new URL(process.argv[1]); console.log(u.hostname)" "$ERP_ORIGIN")}"
          SERVER_USER="${SERVER_USER_VAR:-root}"
          SERVER_SSH_PORT="${SERVER_SSH_PORT_VAR:-22}"
          SERVER_APP_PATH="${SERVER_APP_PATH_VAR:-/opt/flowcube}"
          echo "erp_origin=$ERP_ORIGIN" >> "$GITHUB_OUTPUT"
          echo "server_host=$SERVER_HOST" >> "$GITHUB_OUTPUT"
          echo "server_user=$SERVER_USER" >> "$GITHUB_OUTPUT"
          echo "server_ssh_port=$SERVER_SSH_PORT" >> "$GITHUB_OUTPUT"
          echo "server_app_path=$SERVER_APP_PATH" >> "$GITHUB_OUTPUT"

      # 构建只需要 erp_origin（Capacitor 同步要把它烧进包）；服务器凭据只在 publish 校验。
      - name: Validate build inputs
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${{ steps.deploy_config.outputs.erp_origin }}" ] || { echo "::error::缺少 erp_origin，PDA 包无法指向生产 API"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Sync Capacitor Android project
        working-directory: ./frontend
        env:
          VITE_CAPACITOR: 1
          VITE_ERP_PRODUCTION_ORIGIN: ${{ steps.deploy_config.outputs.erp_origin }}
        run: npm run pda:sync

      - name: Prepare Android signing keystore
        working-directory: ./frontend/android/app
        env:
          PDA_SIGNING_KEYSTORE_BASE64: ${{ secrets.PDA_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$PDA_SIGNING_KEYSTORE_BASE64"
          printf '%s' "$PDA_SIGNING_KEYSTORE_BASE64" | base64 --decode > flowcube-release.keystore

      - name: Build release APK
        working-directory: ./frontend/android
        env:
          FLOWCUBE_UPLOAD_STORE_FILE: flowcube-release.keystore
          FLOWCUBE_UPLOAD_STORE_PASSWORD: ${{ secrets.PDA_SIGNING_STORE_PASSWORD }}
          FLOWCUBE_UPLOAD_KEY_ALIAS: ${{ secrets.PDA_SIGNING_KEY_ALIAS }}
          FLOWCUBE_UPLOAD_KEY_PASSWORD: ${{ secrets.PDA_SIGNING_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease

      - name: Verify APK version
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="frontend/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          EXPECTED_NAME="$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path('frontend/android/app/build.gradle').read_text()
          m = re.search(r'versionName\s+"([^"]+)"', text)
          print(m.group(1) if m else '')
          PY
          )"
          EXPECTED_CODE="$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path('frontend/android/app/build.gradle').read_text()
          m = re.search(r'versionCode\s+(\d+)', text)
          print(m.group(1) if m else '')
          PY
          )"
          test -n "$EXPECTED_NAME"
          test -n "$EXPECTED_CODE"
          APKANALYZER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name apkanalyzer | head -n 1)"
          test -n "$APKANALYZER"
          ACTUAL_NAME="$("$APKANALYZER" manifest version-name "$APK_PATH")"
          ACTUAL_CODE="$("$APKANALYZER" manifest version-code "$APK_PATH")"
          echo "Expected versionName=$EXPECTED_NAME versionCode=$EXPECTED_CODE"
          echo "Actual   versionName=$ACTUAL_NAME versionCode=$ACTUAL_CODE"
          test "$ACTUAL_NAME" = "$EXPECTED_NAME"
          test "$ACTUAL_CODE" = "$EXPECTED_CODE"

          # build.gradle 与 backend/apk/version.json 必须一致：前者是 APK 内置版本，
          # 后者是后端对 PDA 公布的版本，PDA 拿两者比对决定是否更新。此前无人校验，
          # 导致 version.json 长期停在旧版本、APK 每次都在更新却从不被下载。
          JSON_NAME="$(node -p "require('./backend/apk/version.json').version")"
          JSON_CODE="$(node -p "require('./backend/apk/version.json').versionCode")"
          echo "version.json versionName=$JSON_NAME versionCode=$JSON_CODE"
          if [ "$JSON_NAME" != "$EXPECTED_NAME" ] || [ "$JSON_CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::backend/apk/version.json ($JSON_NAME/$JSON_CODE) 与 build.gradle ($EXPECTED_NAME/$EXPECTED_CODE) 不一致；PDA 将无法正确检测更新。请用 bump-version.sh 同步版本号。"
            exit 1
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          VERSION="$(node -p "require('./backend/apk/version.json').version")"
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "out/FlowCubePDA-${VERSION}.apk"

      # 注意：这个 artifact 从「冗余备份」变成了**发布链路的唯一载体**——
      # publish-pda 在独立 job 里下载它并上传到服务器。因此必须成功，
      # 不能再 continue-on-error（那会让发布阶段拿不到包，或更糟：拿到旧包）。
      - name: Upload APK artifact
        id: apk_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flowcube-pda-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7

  # 只「等」不「锁」：这一步存在的意义就是替 publish 把关，同时不占用部署组。
  # 旧结构把它放在持有 deploy 组的 build job 里，正是自锁的来源。
  wait-browser:
    needs: build-pda
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.inputs.checkout_ref || github.sha }}

      - name: Wait for verified browser deployment on this commit
        # 浏览器 job 最多 220 分钟；脚本 225 分钟自行超时，再留 5 分钟给步骤退出。
        timeout-minutes: 230
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_BROWSER_DEPLOY: '1'
          # 以实际检出的提交为准（补跑时与 github.sha 可能不同）
          GITHUB_SHA: ${{ needs.build-pda.outputs.sha }}
        run: node scripts/wait-release-checks.js

  # 临界区：只在这里持有 `flowcube-server-deploy`，与浏览器部署 / 桌面发布串行。
  # 因为进入本 job 时浏览器部署已确认成功，等待不再是本 job 的一部分，自锁消除。
  publish-pda:
    needs: [build-pda, wait-browser]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: flowcube-server-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.inputs.checkout_ref || github.sha }}
          fetch-depth: 0

      - name: Resolve target commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "目标提交：${sha}"
          # 构建与发布必须是同一个提交，否则发布的包与校验的 HEAD 对不上。
          if [ "$sha" != "${{ needs.build-pda.outputs.sha }}" ]; then
            echo "::error::发布提交（${sha}）与构建提交（${{ needs.build-pda.outputs.sha }}）不一致，拒绝发布。"
            exit 1
          fi

      - name: Resolve deploy config
        id: deploy_config
        shell: bash
        env:
          ERP_ORIGIN_VAR: ${{ vars.VITE_ERP_PRODUCTION_ORIGIN }}
          SERVER_HOST_VAR: ${{ vars.FLOWCUBE_SERVER_HOST }}
          SERVER_USER_VAR: ${{ vars.FLOWCUBE_SERVER_USER }}
          SERVER_SSH_PORT_VAR: ${{ vars.FLOWCUBE_SERVER_SSH_PORT }}
          SERVER_APP_PATH_VAR: ${{ vars.FLOWCUBE_SERVER_APP_PATH }}
        run: |
          set -euo pipefail
          if node scripts/read-deploy-config.js >/tmp/flowcube-deploy-config.json 2>/tmp/flowcube-deploy-config.err; then
            echo "erp_origin=$(node scripts/read-deploy-config.js erpOrigin)" >> "$GITHUB_OUTPUT"
            echo "server_host=$(node scripts/read-deploy-config.js server.host)" >> "$GITHUB_OUTPUT"
            echo "server_user=$(node scripts/read-deploy-config.js server.user)" >> "$GITHUB_OUTPUT"
            echo "server_ssh_port=$(node scripts/read-deploy-config.js server.sshPort)" >> "$GITHUB_OUTPUT"
            echo "server_app_path=$(node scripts/read-deploy-config.js server.appPath)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ERP_ORIGIN="${ERP_ORIGIN_VAR:-}"
          [ -n "$ERP_ORIGIN" ] || { echo "::error::缺少部署配置：设置 deploy/production.local.json 或 GitHub Variable VITE_ERP_PRODUCTION_ORIGIN"; cat /tmp/flowcube-deploy-config.err || true; exit 1; }
          SERVER_HOST="${SERVER_HOST_VAR:-$(node -e "const u=new URL(process.argv[1]); console.log(u.hostname)" "$ERP_ORIGIN")}"
          SERVER_USER="${SERVER_USER_VAR:-root}"
          SERVER_SSH_PORT="${SERVER_SSH_PORT_VAR:-22}"
          SERVER_APP_PATH="${SERVER_APP_PATH_VAR:-/opt/flowcube}"
          echo "erp_origin=$ERP_ORIGIN" >> "$GITHUB_OUTPUT"
          echo "server_host=$SERVER_HOST" >> "$GITHUB_OUTPUT"
          echo "server_user=$SERVER_USER" >> "$GITHUB_OUTPUT"
          echo "server_ssh_port=$SERVER_SSH_PORT" >> "$GITHUB_OUTPUT"
          echo "server_app_path=$SERVER_APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate deploy inputs
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${{ steps.deploy_config.outputs.erp_origin }}" ] || { echo "::error::缺少 erp_origin"; exit 1; }
          [ -n "${{ steps.deploy_config.outputs.server_host }}" ] || { echo "::error::缺少 server_host"; exit 1; }
          [ -n "${{ steps.deploy_config.outputs.server_user }}" ] || { echo "::error::缺少 server_user"; exit 1; }
          [ -n "${{ steps.deploy_config.outputs.server_app_path }}" ] || { echo "::error::缺少 server_app_path"; exit 1; }
          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] || { echo "::error::缺少 Actions Secret: SSH_PRIVATE_KEY"; exit 1; }

      - name: Setup SSH agent
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE=~/.ssh/flowcube_ci_key
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add "$KEY_FILE"

      - name: Add SSH known_hosts
        shell: bash
        run: |
          set -euo pipefail
          # 服务器 SSH 层存在**间歇性**不可用：2026-09-19 实测同一分钟内 ssh-keyscan 可能先失败、随后成功
          # （12:06 部署失败 → 12:2x rerun 成功 → 12:49 诊断又失败）。keyscan 默认 5 秒超时且不重试，单次失败
          # 就让整条部署/诊断链终止，表现为「Add SSH known_hosts: failure」——与网络不通无法区分、也无法自愈。
          # 现改为最多 5 次尝试（每次 -T 10 + timeout 20，只有拿到非空输出才算成功），全失败才终止并打印 stderr。
          HOST="${{ steps.deploy_config.outputs.server_host }}"
          PORT="${{ steps.deploy_config.outputs.server_ssh_port }}"
          keyscan_ok=0
          for attempt in 1 2 3 4 5; do
            if timeout 20 ssh-keyscan -T 10 -H -p "$PORT" "$HOST" > /tmp/keyscan.out 2>/tmp/keyscan.err && [ -s /tmp/keyscan.out ]; then
              cat /tmp/keyscan.out >> ~/.ssh/known_hosts
              keyscan_ok=1
              break
            fi
            echo "::warning::ssh-keyscan 第 ${attempt} 次失败（服务器 SSH 间歇不可用？），5 秒后重试"
            sleep 5
          done
          if [ "$keyscan_ok" != '1' ]; then
            echo "::error::ssh-keyscan 连续 5 次失败，无法建立 ~/.ssh/known_hosts"
            tail -5 /tmp/keyscan.err 2>/dev/null || true
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      # 承接构建产物。必须在发布前校验存在性与版本，不能把「没拿到包」或「拿到旧包」静默带过去。
      - name: Download APK artifact
        # 与仓库在用的 upload-artifact 保持同一大版本线（那里 pin 的是 7.0.1）。
        # 跨大版本配对虽在 v4+ 协议下通常可用，但没必要冒这个险。
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: flowcube-pda-apk
          path: out

      - name: Validate downloaded APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${{ needs.build-pda.outputs.version }}"
          APK_PATH="$(ls -1 out/*.apk 2>/dev/null | head -n 1 || true)"
          [ -n "$APK_PATH" ] || { echo "::error::未取到构建产物（artifact flowcube-pda-apk）；构建阶段可能失败或被取消。"; ls -la out || true; exit 1; }
          echo "APK_PATH=${APK_PATH}"
          case "$(basename "$APK_PATH")" in
            *"${EXPECTED_VERSION}"*) ;;
            *) echo "::error::产物文件名与目标版本 ${EXPECTED_VERSION} 不匹配：$(basename "$APK_PATH")"; exit 1 ;;
          esac
          test -s "$APK_PATH"
          echo "APK_BASENAME=$(basename "$APK_PATH")" >> "$GITHUB_ENV"
          echo "APK_PATH=${APK_PATH}" >> "$GITHUB_ENV"

      - name: Publish PDA APK to server
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_ARTIFACT_ID: ${{ needs.build-pda.outputs.artifact_id }}
        run: |
          set -euo pipefail
          APK_PATH="${APK_PATH}"
          VERSION_JSON="backend/apk/version.json"
          REMOTE="${{ steps.deploy_config.outputs.server_user }}@${{ steps.deploy_config.outputs.server_host }}"
          PORT="${{ steps.deploy_config.outputs.server_ssh_port }}"
          APP_PATH="${{ steps.deploy_config.outputs.server_app_path }}"
          # 每次运行使用独立上传路径；只发布挂载目录的产物，不重建应用或修改服务器 Git。
          SSHO="-o ServerAliveInterval=30 -o ServerAliveCountMax=6"
          UPLOAD_PREFIX="/tmp/flowcube-pda-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'ssh $SSHO -p "$PORT" "$REMOTE" "rm -f ${UPLOAD_PREFIX}.apk ${UPLOAD_PREFIX}.json" >/dev/null 2>&1 || true' EXIT
          bash scripts/transfer-release-asset.sh "$APK_PATH" "$REMOTE" "$PORT" "${UPLOAD_PREFIX}.apk"
          scp $SSHO -P "$PORT" "$VERSION_JSON" "$REMOTE:${UPLOAD_PREFIX}.json"
          ssh $SSHO -p "$PORT" "$REMOTE" <<EOF
          set -euo pipefail
          cd "$APP_PATH"
          exec 9>/tmp/flowcube-deploy.lock
          flock -w 1800 9
          test "\$(git rev-parse HEAD)" = "${TARGET_SHA}"
          trap 'rm -f "${UPLOAD_PREFIX}.apk" "${UPLOAD_PREFIX}.json"' EXIT
          bash scripts/publish-pda.sh "${UPLOAD_PREFIX}.apk" "${UPLOAD_PREFIX}.json" backend/apk
          EOF

      - name: Verify live PDA update endpoint
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(node -p "require('./backend/apk/version.json').version")"
          EXPECTED_CODE="$(node -p "require('./backend/apk/version.json').versionCode")"
          VERSION_JSON=""
          for attempt in {1..30}; do
            if VERSION_JSON="$(curl -fsSL -H 'Cache-Control: no-cache' "${{ steps.deploy_config.outputs.erp_origin }}/api/pda/version?_=${GITHUB_RUN_ID}-${attempt}")"; then
              break
            fi
            echo "PDA version endpoint not ready, retry ${attempt}/30"
            sleep 2
          done
          test -n "$VERSION_JSON"
          echo "$VERSION_JSON"
          ACTUAL_VERSION="$(node -e "const j=JSON.parse(process.argv[1]); console.log(j.data?.version || '')" "$VERSION_JSON")"
          ACTUAL_CODE="$(node -e "const j=JSON.parse(process.argv[1]); console.log(j.data?.versionCode || '')" "$VERSION_JSON")"
          DOWNLOAD_URL="$(node -e "const j=JSON.parse(process.argv[1]); console.log(j.data?.downloadUrl || '')" "$VERSION_JSON")"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          test "$ACTUAL_CODE" = "$EXPECTED_CODE"
          printf '%s' "$DOWNLOAD_URL" | grep -F "code=${EXPECTED_CODE}" >/dev/null
          for attempt in {1..30}; do
            if curl -fsSI -H 'Cache-Control: no-cache' "$DOWNLOAD_URL" | tee /tmp/pda-download-head.txt; then
              break
            fi
            echo "PDA download endpoint not ready, retry ${attempt}/30"
            sleep 2
          done
          grep -Fi "x-flowcube-pda-version-code: ${EXPECTED_CODE}" /tmp/pda-download-head.txt >/dev/null
