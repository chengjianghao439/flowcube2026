        run: npm run test:accounting

      - name: 单元测试 — 销售收入凭证整单折扣净额口径（纯函数，无需 DB）
        run: npm run test:sale-revenue-discount

      - name: 单元测试 — 个税累计预扣法（纯函数，无需 DB）
        run: npm run test:hr-tax

      - name: 单元测试 — 操作日志脱敏（纯函数，无需 DB）
        run: npm run test:oplog

      - name: 单元测试 — 快递官方接口与防重复下单（无需 DB）
        run: npm run test:direct-express

      - name: 单元测试 — 订单记录归属与数据范围（无需 DB）
