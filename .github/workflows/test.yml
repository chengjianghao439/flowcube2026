      - name: 迁移文件编号校验（历史重复/缺号 warn；新增撞号编号会失败，审计 4.10）
        run: npm --prefix backend run migrate -- --check-gaps

      - name: 等待 MySQL 就绪
        run: |
          set -e
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL ready"; exit 0
            fi
            echo "waiting for mysql... ($i)"; sleep 2
          done
          echo "MySQL did not become ready in time" >&2; exit 1

      - name: 创建测试数据库（smoke + 集成各一套）
        run: |
          set -e
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS flowcube_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS flowcube_integration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: 数据库迁移 — smoke 库
        run: npm --prefix backend run migrate

      - name: 数量两位精度 — 实际拆分守恒与迁移重放
        run: npm run smoke:qty-precision

      - name: 往来明细 — 单位归属、预收核销、退款和余额回归
        run: npm run smoke:party-ledger

      - name: 按单登记 — 未结清与导出查询一致性
        run: npm run smoke:payments-default-scope

      - name: 快递月结直连 — MySQL 入队与并发恢复回归
        run: npm run smoke:direct-express

      - name: Schema 对账（迁移建表后：已执行迁移声明的表 + 活跃期唯一键 vs 实际库，文档12 / 审计 [16]④）
        run: node backend/scripts/schema-reconcile.js --strict

      - name: 2026-09-24 认证、资金精度与视图对账回归
        run: npm run smoke:audit-remediation-20260924

      - name: 价目表绑定客户路由可达性（真实 HTTP：绑定生效 + 取价采用 + 通用 /:id 仍可用）
        run: npm run smoke:price-list-bind-customer

      - name: 数据库迁移 — 集成库
        run: npm --prefix backend run migrate
        env:
          DB_NAME: flowcube_integration_test

      - name: 审计回归 — 库存/退货/预计绑定
        run: npm run smoke:audit-inventory

      - name: 审计回归 — 2026-09-18 深审计 P0（撤回收货×在途调拨 / 盘点×拣货锁定 / 补占换仓）
        run: npm run smoke:audit-2026-09-18

      - name: 审计回归 — 标签渲染失败降级不得回滚业务事务
