      - name: 冒烟测试 — 发票编辑乐观锁（并发编辑不得静默覆盖；依赖迁移 263 的 revision）
        run: npm run smoke:invoice-edit-concurrency

      - name: 冒烟测试 — 商品价格列版本保护（旧表单不得回退已审批的等级价/成本价；依赖迁移 264）
        run: npm run smoke:product-price-version-guard

      - name: 冒烟测试 — 已收款退货退款（红冲已收+账户出账+退货守卫联动）
        run: npm run smoke:refund-orders

      - name: 冒烟测试 — 会计凭证引擎（借贷平衡 / 资金勾稽 / 幂等）
        run: npm run smoke:accounting

      - name: 冒烟测试 — 会计期间结转/月结（期间锁定+结转链，2026-08-22 补入 CI）
        run: npm run smoke:accounting-period

      - name: 冒烟测试 — 打印模板真实数据与权限范围
        run: npm run smoke:print-template-preview

      - name: 冒烟测试 — 打印领取令牌、过期、路由及份数
        run: npm run smoke:print-queue

      # 真实库：① 补打接口拒绝已作废容器且不新增任务；② 撤回须一并终结「未领取」的
      # PENDING 任务（领取端不校验业务对象，只堵补打入口挡不住已入队的那些）；③ 锁序与
      # 两种并发顺序。必须跑在独立回环测试库。
      - name: 冒烟测试 — 撤回后作废容器不得补打、未领取任务须终结（并发/锁序）
        run: npm run smoke:print-barcode-void

      # 真实业务路径：造可撤回收货单后走真正的 voidReceipt，验证撤回事务的完整副作用
      # （容器 VOID、单据回退、未领取任务终结且不可领取），以及撤回被拒时不得误终结。
      - name: 冒烟测试 — 撤回收货走真实 service 须终结未领取任务、被拒时不误终结
        run: npm run smoke:print-barcode-void-receipt

      - name: 冒烟测试 — 打印任务过期/回收清理（队列防卡死）
        run: npm run test:print-purge

      - name: 冒烟测试 — 全局搜索仓库过滤（审计 A.4 守护，2026-08-22 新增）
        run: node tests/search-scope.smoke.test.js

      - name: 冒烟测试 — 用户改密/禁用 token 失效（安全语义守护，2026-08-22 新增）
