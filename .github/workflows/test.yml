# ============================================================
# 极序 Flow — 自动化测试门禁
#
# 触发：push 到 main、对 main 的 PR、手动触发
#
# 作用：在独立 MySQL 测试库上跑回归测试，作为发布前门禁。
#   绝不连接任何生产数据库（仅使用 service 容器里的临时库）。
#
# 内容：
#   0. static job：两端 ESLint + 前端 tsc（不需要 DB，与回归门禁并行）
#   1. 起 MySQL 8.0 service 容器（root/root，临时库）
#   2. 安装后端依赖、建库、跑迁移建表
#   3. smoke:mainline + smoke:concurrency-guards + smoke:sale-adjustment + smoke:p0-regression
#      （主链路 + 并发/回滚护栏 + 改单 + P0 回归）
#      p0-regression 锁死 2026-07 架构审计发现的五个「静默出错」缺陷：不报错、界面正常、
#      错误直接落进库存或账款，靠人工点测发现不了，必须由测试守住。
#      p1-regression 同源，覆盖并发一致性（锁定容器、死锁、上架丢失更新、热点索引）与
#      收货侧防错（容器采购归属与成本计价、超收双闸门与留痕、重复扫码防重）。
#   4. smoke:finance（收款核销 / 汇总对账单 / 资金账户 / 费用报销）
#      与 p0/p1 同性质，只是错的是钱不是货：账户余额与对账单已核销额都是「投影」，
#      一旦有人写成读余额→加减→写回就会静默错账，界面看不出来。
#   5. test:integration（采购入库 → 占库 → 调拨 → 盘点 → 退货 库存一致性，
#      使用独立测试库，避免与 smoke 数据相互污染）
#   任一测试失败则 job 失败。
# ============================================================
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  browser-smoke-runtime:
    name: 页面验收脚本（本地夹具真浏览器）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/browser-smoke/package-lock.json
      - run: npm ci --prefix scripts/browser-smoke --ignore-scripts
      - run: node scripts/browser-smoke/node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run test:browser-smoke
      - run: npm ci --prefix frontend
      - run: npm install --global agent-browser@0.36.0
      - run: agent-browser install --with-deps
      - run: npm run test:dirty-navigation

  static:
    name: 静态检查（lint + 类型）
    runs-on: ubuntu-latest
    # 不需要 MySQL，和回归门禁并行跑，几分钟内就能给出反馈
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: 三端版本一致性校验（防只升一端就发版，2026-08-22 补齐）
        run: |
          set -euo pipefail
          B=$(node -p "require('./backend/package.json').version")
          F=$(node -p "require('./frontend/package.json').version")
          D=$(node -p "require('./desktop/package.json').version")
          echo "backend=$B frontend=$F desktop=$D"
          [ "$B" = "$F" ] && [ "$F" = "$D" ] || { echo "::error::三端版本号不一致：backend=$B frontend=$F desktop=$D"; exit 1; }

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: 安装后端依赖
        run: npm --prefix backend ci

      - name: 安装前端依赖
        run: npm --prefix frontend ci

      - name: 契约测试 — 界面文案口径（禁用实现词/半角标点/官网双份一致/金额格式化）
        run: npm run test:copy-conventions

      - name: 契约测试 — 数量精度开关的接入覆盖（新入口漏接即失败）
        run: npm run test:qty-precision-coverage

      - name: 安装桌面更新模块运行依赖（不下载 Electron）
        run: npm --prefix desktop ci --ignore-scripts --omit=dev

      - name: 单元测试 — 成套配件组成与整数分摊
        run: npm run test:kits-composition

      - name: 单元测试 — 商业行分批金额与来源组件退款纯规则
        run: npm run test:sale-commercial-money
      - name: Kit lifecycle commercial contracts and accounting projections
        run: npm run test:sale-commercial

      - name: 单元测试 — 标签几何及前端镜像（Node 22 实际执行）
        run: npm run test:label
      - name: 契约测试 — 官网版本摘要必须与发版版本同步（防 bump 后漏同步）
        run: npm run test:landing-updates

      - name: 上传单文件与字段限制回归
        run: npm run test:upload && npm run test:export

      # 列表导出必须与页面同口径：解析各列表接口 findAll 的筛选签名，断言导出把它们全部透传。
      # 纯离线（stub findAll，不连库）——2026-09-27 修「对账单/收付款单导出丢弃筛选」时补齐；
      # 这类缺陷在页面、接口、原守卫全绿时完全不可见（原 stub 恰好只断言了 keyword）。
      - name: 契约测试 — 列表导出透传列表接口支持的每一个筛选
        run: npm run test:export-filters

      - name: "验收修复回归 — 请求体解析错误码、废弃设置键、取消单明细投影、审计覆盖"
        run: npm run test:acceptance-fixes

      - name: 审计回归 — 工具隔离、发布门禁、原生更新与退货扫码
        run: npm run test:audit-tooling && npm run test:audit-client && npm run test:prelaunch-runtime && npm run test:round2-runtime

      - name: 发布工具回归 — Release 附件上传（超时/重试/落地校验）与发版后线上核对
        run: npm run test:release-tooling

      # backend/downloads 已废弃：.gitignore 挡住普通提交，但 `git add -f` 仍能把安装包塞进仓库，
      # 守卫只看 git 视角，所以必须在这里真的跑一次。
      - name: 发布工具回归 — 废弃的 backend/downloads 不得提交发布文件
        run: npm run release:check-downloads

      - name: 运维回归 — 备份恢复判定与数据库指标
        run: node --test tests/ops-monitor-restore.test.js tests/deployment-resources.test.js tests/restore-trigger-normalize.test.js tests/migration-trigger-bodies.test.js

      # 本地实例脚本：`start` 只能启动实例、迁移必须由显式 `migrate` 触发且目标固定。
      # 否则"只想借 3307 实例做隔离测试"会顺带把迁移写进开发库（同类边界失效已发生过两次，
      # 机制不同）。测试全程 stub colima/docker/npm，不连库、不起容器。
      - name: 本地实例脚本 — start 不改库结构、migrate 显式且目标固定
        run: npm run test:mysql8-dev-script

      - name: 修复专项归属门 — 含全表清理的 smoke 只允许落在本批专属临时实例
        run: npm run test:repair-smoke-instance-guard

      # 出库前置扫码闭环是纯离线断言（stub conn，不连数据库）：明细存在但一条扫码记录都没有时
      # 必须拒绝——批量 GROUP BY 后这类明细在结果里不出现，改写成"缺失就跳过"会让闸门 fail-open。
      - name: 出库前置扫码闭环 — 无扫码行必须拒绝（防批量改写 fail-open）
        run: npm run test:warehouse-scan-closure

      - name: 跨域回归 — 桌面端与 PDA 精确来源
        run: node --test tests/cors-policy.test.js

      - name: "PDA 契约回归 — pdaOnly 路由必须带 X-Client 头"
        run: node --test tests/pda-only-client-header.test.js

      - name: Nginx 安全头和缓存策略真实响应
        run: npm run smoke:nginx-headers

      - name: 已确认审计问题回归
        run: npm run test:confirmed-audit

      - name: ESLint — 后端
        run: npm --prefix backend run lint

      # hooks 依赖规则为 error；现有刷新导出结构 warning 不设 --max-warnings。
      - name: ESLint — 前端
        run: npm --prefix frontend run lint

      # 后端是纯 JS 没有类型兜底，前端的类型检查就是这个项目唯一的类型门禁。
      # 必须用 tsconfig.app.json：根 tsconfig.json 是 files:[] 的空壳，永远 0 错误。
      - name: TypeScript — 前端类型检查
        run: ./frontend/node_modules/.bin/tsc -p frontend/tsconfig.app.json --noEmit

      # 前端单元测试（vitest，审计 4.3 起步）：纯逻辑，无需 DB
      - name: 前端单元测试 — vitest
        run: npm --prefix frontend run test:unit

      - name: 分拣格交接精确查询契约
        run: npm run test:sorting-bin-handoff

      - name: 履约与采购建议计算回归
        run: npm run test:fulfillment && npm run test:fulfillment-refresh && npm run test:procurement-planning

  regression-plastic-box:
    name: 批 A 塑料盒作业流（放货 / 混批 / 还原整件）
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flowcube_plastic_box_20260929_test
        # 本批 smoke **硬断言**回环 3307 + 确切专库名（本地隔离约束，防止误连共享库）。
        # 因此独立映射 3307 并单开一个 job，不改动其它 job 的 3306。
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: flowcube_plastic_box_20260929_test
      JWT_SECRET: flowcube_ci_test_jwt_secret_0123456789_abcdef
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
      APP_UPDATE_DOWNLOADS_DIR: /tmp/flowcube-downloads

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 安装后端依赖
        run: npm --prefix backend ci

      - name: 创建本批独立测试库
        run: |
          set -e
          mysql -h 127.0.0.1 -P 3307 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS flowcube_plastic_box_20260929_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: 数据库迁移 — 本批专库
        run: npm --prefix backend run migrate

      - name: 批 A 塑料盒作业流 — 放货 / 混批 / 还原整件（27 项断言）
        run: npm run smoke:plastic-box-batch-a

      # 与批 A 同一专库、同一 3307 service 顺序执行（复用本 job，不再另造 job）
      - name: 批 B（B1+B2）— 扫盒取货生成锁定新 I + 独立取货标签（17 项断言）
        run: npm run smoke:plastic-box-pick

      # B3a — 取货码下游链：分拣取货码接真实 sort-done + 复核真实 CHECK 闭合（19 项断言）
      - name: 批 B3a — 取货码分拣 / 复核下游链（19 项断言）
        run: npm run smoke:pick-code-downstream

      # B3b — 装箱配额按来源取货标签分行 + remove/void 回收（8 项断言）
      - name: 批 B3b — 装箱配额与回收（8 项断言）
        run: npm run smoke:pack-quota

      # B4 — 取货码的取消 / 减量归还闭环（5 项断言）
      - name: 批 B4 — 取货码取消 / 减量归还（5 项断言）
        run: npm run smoke:pick-cancel-return

      # B4 补充 — 取货标签补打的生命周期边界（3 项断言）：已出库 EMPTY 后仍可按真实 PICK 补打、
      # 已取消仍拒、普通整件复用不得认旧标签
      - name: 批 B4 补充 — 取货标签补打生命周期（3 项断言）
        run: npm run smoke:pick-label-reprint-lifecycle

      # 批 C1 — 装箱异常恢复：remove-item / void 的稳定键与原目标回执（7 项断言）
      - name: 批 C1 — 装箱移出 / 作废的稳定键与重放（7 项断言）
        run: npm run smoke:pack-remove-void-replay

      # 批 C2 — 完成箱子 finish 的回执事务（9 项断言：范围先于 replay、三种故障注入全量回滚 + 原键可重试）
      - name: 批 C2 — 完成箱子回执事务与故障注入（9 项断言）
        run: npm run smoke:pack-finish-receipt-tx

      # 批 C4 — 打包末尾两入口（8 项断言：pack-done 原键重放/新键状态拒绝、箱贴同 key 跨箱不串 job、
      # 缺箱 404 不留回执、设备仓与限仓范围、历史错误回执经写重放与查询入口双拦、回执写入故障整体回滚）
      - name: 批 C4 — 打包完成与箱贴补打的幂等 / 范围 / 回执（8 项断言）
        run: npm run smoke:pack-done-replay

  regression:
    name: 回归门禁（smoke + 集成）
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flowcube_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: flowcube_test
      JWT_SECRET: flowcube_ci_test_jwt_secret_0123456789_abcdef
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
      # CI runner 无权限写 /var/www，桌面下载目录指到可写的临时目录
      APP_UPDATE_DOWNLOADS_DIR: /tmp/flowcube-downloads

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 安装后端依赖
        run: npm --prefix backend ci

      - name: 单元测试 — 打印调度策略/任务状态（纯函数，无需 DB）
        run: npm run test:print

      # 作废容器（撤回收货等）不得补打：显示、筛选、计数必须同口径。
      # 纯离线断言——显示按容器状态派生、筛选历来只看打印状态，两者不同源会让
      # 「筛已打印」收进显示为「已作废」的行，这条守卫逐分支锁死。
      - name: 契约测试 — 作废容器条码不得补打（显示/筛选/计数同口径）
        run: npm run test:print-barcode-void

      - name: 单元测试 — 前后端权限码一致性（纯静态，无需 DB）
        run: npm run test:permissions

      - name: 契约测试 — 所有写路由必须挂 requirePermission（例外须登记理由且可验证）
        run: npm run test:route-permission-contract

      - name: 契约测试 — 财务域加锁顺序 账户→对账单→账款（防 ABBA 死锁环）
        run: npm run test:finance-lock-order

      - name: 库存域加锁顺序契约（机械核对）
        run: npm run test:inventory-lock-order

      - name: 契约测试 — 库存缓存只能由引擎入口写（防 quantity/reserved 被旁路改写导致静默漂移）
        run: npm run test:stock-cache-write

      - name: 契约测试 — 补打唯一入口且销售侧无条码打印（防订单页长出补打按钮）
        run: npm run test:print-entry

      - name: 契约测试 — 商品数量精度开关（只允许整数的商品不得按小数出入库）
        run: npm run test:qty-precision

      - name: 契约测试 — 前端命名与呈现结构（菜单/标签/页面标题同名、标签长度、重置口径、图标按钮可读）
        run: npm run test:frontend-conventions

      - name: 契约测试 — 引擎不得自行管理事务（防写操作脱离调用方事务）
        run: npm run test:engine-transaction

      - name: SQL 占位符与列数一致性契约（机械核对，防 ER_PARSE_ERROR）
        run: npm run test:sql-placeholder
      - name: 契约测试 — SQL 标识符插值必须有白名单校验（防表名/列名注入）
        run: npm run test:sql-identifier

      - name: 契约测试 — AGENTS.md 注入守卫（禁 CLAUDE.md 候选、体积预算、docs 引用有效性）
        run: npm run test:agents-md-guard
      - name: 契约测试 — 前端业务日期必须走 lib/dateTime（防自拼日期偏一天）
        run: npm run test:frontend-date-source

      - name: 契约测试 — 每处 eslint-disable 必须写明理由（防为过门禁屏蔽问题）
        run: npm run test:eslint-disable-rationale

      - name: 契约测试 — logger 调用必须是 (msg, meta, module) 顺序（防日志错位读不出来）
        run: npm run test:logger-args-order

      - name: 契约测试 — PDA 扫码页不得自动聚焦（防软键盘挡住扫码视野）
        run: npm run test:pda-scan-focus

      - name: 契约测试 — PDA 列表必须即时刷新（防 keep-alive 下看不到 ERP 刚派发的单据）
        run: npm run test:pda-list-refresh

      - name: 契约测试 — 分布类图表系列必须有界（防 94 个账户/253 个仓全量成系列，调色板只有 8 色）
        run: npm run test:chart-series-limit

      - name: 契约测试 — 前端调用的接口后端必须存在（防路由改名漏改前端后运行期 404）
        run: npm run test:api-route-contract

      - name: 契约测试 — 只读路径不得逐行单查（防 N+1，锁内逐行加锁不在判定范围）
        run: npm run test:query-loop

      - name: 契约测试 — 前端登出必须走统一封装（防漏清缓存/漏作废 refresh）
        run: npm run test:frontend-session-contract

      - name: 契约测试 — 前端轮询间隔与批量（防小批量叠加高频轮询打满限流）
        run: npm run test:frontend-polling-contract

      # 以下 4 个是 2026-09-18 审计发现的「孤儿测试」：文件存在、能跑通，但从未被任何脚本或
      # workflow 引用，因此从未真正守过任何东西。接线后它们才真正进入门禁。
      - name: 单元测试 — 销售单数量契约（最小精度 0.0001 等，审计孤儿测试接线）
        run: npm run test:sale-order-contract

      - name: 单元测试 — 全局搜索日期口径（审计孤儿测试接线）
        run: npm run test:search-all-dates

      - name: 单元测试 — 审批待办计数口径（审计孤儿测试接线）
        run: npm run test:approval-list-batches

      - name: 单元测试 — 商品选择器（审计孤儿测试接线）
        run: npm run test:product-finder

