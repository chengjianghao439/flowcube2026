      - name: Kit saved-scope replay and current return completion gates
        run: npm run smoke:sale-commercial-review
      - name: Kit partial cancellation PICK shares and current task/device scope
        run: npm run smoke:sale-commercial-partial-cancel
      - name: Kit commercial read projections and original task receipt
        run: npm run smoke:sale-commercial-readonly
