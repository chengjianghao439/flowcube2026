# ============================================================
# 极序 Flow — 自动化测试门禁
#
# 触发：push 到 main、对 main 的 PR、手动触发
#
# 作用：在独立 MySQL 测试库上跑回归测试，作为发布前门禁。
#   绝不连接任何生产数据库（仅使用 service 容器里的临时库）。
#
# 内容：
#   0. static job：两端 ESLint + 前端 tsc（不需要 DB，与回归门禁并行）
#   1. 起 MySQL 8.0 service 容器（root/root，临时库）
#   2. 安装后端依赖、建库、跑迁移建表
#   3. smoke:mainline + smoke:concurrency-guards + smoke:sale-adjustment + smoke:p0-regression
#      （主链路 + 并发/回滚护栏 + 改单 + P0 回归）
#      p0-regression 锁死 2026-07 架构审计发现的五个「静默出错」缺陷：不报错、界面正常、
#      错误直接落进库存或账款，靠人工点测发现不了，必须由测试守住。
#      p1-regression 同源，覆盖并发一致性（锁定容器、死锁、上架丢失更新、热点索引）与
#      收货侧防错（容器采购归属与成本计价、超收双闸门与留痕、重复扫码防重）。
#   4. smoke:finance（收款核销 / 汇总对账单 / 资金账户 / 费用报销）
#      与 p0/p1 同性质，只是错的是钱不是货：账户余额与对账单已核销额都是「投影」，
#      一旦有人写成读余额→加减→写回就会静默错账，界面看不出来。
#   5. test:integration（采购入库 → 占库 → 调拨 → 盘点 → 退货 库存一致性，
#      使用独立测试库，避免与 smoke 数据相互污染）
#   任一测试失败则 job 失败。
# ============================================================
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  static:
    name: 静态检查（lint + 类型）
    runs-on: ubuntu-latest
    # 不需要 MySQL，和回归门禁并行跑，几分钟内就能给出反馈
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: 三端版本一致性校验（防只升一端就发版，2026-08-22 补齐）
        run: |
          set -euo pipefail
          B=$(node -p "require('./backend/package.json').version")
          F=$(node -p "require('./frontend/package.json').version")
          D=$(node -p "require('./desktop/package.json').version")
          echo "backend=$B frontend=$F desktop=$D"
          [ "$B" = "$F" ] && [ "$F" = "$D" ] || { echo "::error::三端版本号不一致：backend=$B frontend=$F desktop=$D"; exit 1; }

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: 安装后端依赖
        run: npm --prefix backend ci

      - name: 安装前端依赖
        run: npm --prefix frontend ci

      - name: 安装桌面更新模块运行依赖（不下载 Electron）
        run: npm --prefix desktop ci --ignore-scripts --omit=dev

      - name: 单元测试 — 标签几何及前端镜像（Node 22 实际执行）
        run: npm run test:label

      - name: 审计回归 — 工具隔离、发布门禁、原生更新与退货扫码
        run: npm run test:audit-tooling && npm run test:audit-client

      - name: 运维回归 — 备份恢复判定与数据库指标
        run: node --test tests/ops-monitor-restore.test.js tests/deployment-resources.test.js

      - name: 跨域回归 — 桌面端与 PDA 精确来源
        run: node --test tests/cors-policy.test.js

      - name: ESLint — 后端
        run: npm --prefix backend run lint

      # hooks 依赖规则为 error；现有刷新导出结构 warning 不设 --max-warnings。
      - name: ESLint — 前端
        run: npm --prefix frontend run lint

      # 后端是纯 JS 没有类型兜底，前端的类型检查就是这个项目唯一的类型门禁。
      # 必须用 tsconfig.app.json：根 tsconfig.json 是 files:[] 的空壳，永远 0 错误。
      - name: TypeScript — 前端类型检查
        run: ./frontend/node_modules/.bin/tsc -p frontend/tsconfig.app.json --noEmit

      # 前端单元测试（vitest，审计 4.3 起步）：纯逻辑，无需 DB
      - name: 前端单元测试 — vitest
        run: npm --prefix frontend run test:unit

  regression:
    name: 回归门禁（smoke + 集成）
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flowcube_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: flowcube_test
      JWT_SECRET: flowcube_ci_test_jwt_secret_0123456789_abcdef
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
      # CI runner 无权限写 /var/www，桌面下载目录指到可写的临时目录
      APP_UPDATE_DOWNLOADS_DIR: /tmp/flowcube-downloads

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 安装后端依赖
        run: npm --prefix backend ci

      - name: 单元测试 — 打印调度策略/任务状态（纯函数，无需 DB）
        run: npm run test:print

      - name: 单元测试 — 前后端权限码一致性（纯静态，无需 DB）
        run: npm run test:permissions

      - name: 单元测试 — 会计科目映射一致性（映射↔seed↔常量，纯静态，无需 DB）
        run: npm run test:accounting

      - name: 单元测试 — 个税累计预扣法（纯函数，无需 DB）
        run: npm run test:hr-tax

      - name: 单元测试 — 操作日志脱敏（纯函数，无需 DB）
        run: npm run test:oplog

      - name: 单元测试 — 状态机动作表完整性（纯静态，防常量漂移）
        run: node tests/status-rules-integrity.test.js

      - name: 迁移文件编号校验（历史重复/缺号 warn；新增撞号编号会失败，审计 4.10）
        run: npm --prefix backend run migrate -- --check-gaps

      - name: 等待 MySQL 就绪
        run: |
          set -e
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL ready"; exit 0
            fi
            echo "waiting for mysql... ($i)"; sleep 2
          done
          echo "MySQL did not become ready in time" >&2; exit 1

      - name: 创建测试数据库（smoke + 集成各一套）
        run: |
          set -e
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS flowcube_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS flowcube_integration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: 数据库迁移 — smoke 库
        run: npm --prefix backend run migrate

      - name: Schema 对账（迁移建表后：已执行迁移声明的表 vs 实际库，文档12）
        run: npm run check:schema

      - name: 数据库迁移 — 集成库
        run: npm --prefix backend run migrate
        env:
          DB_NAME: flowcube_integration_test

      - name: 审计回归 — 库存/退货/预计绑定
        run: npm run smoke:audit-inventory

      - name: 审计回归 — 报表/来源修订/冲销/超管保护
        run: npm run smoke:audit-finance-security

      - name: 冒烟测试 — 主链路（采购入库 / 打印 / 报表 / 导入导出 / 权限）
        run: npm run smoke:mainline

      - name: 冒烟测试 — 并发与回滚护栏（幂等 / 拆分 / 仓库任务取消）
        run: npm run smoke:concurrency-guards

      - name: 冒烟测试 — 销售单执行期改单（增减量 / PDA物理确认）
        run: npm run smoke:sale-adjustment

      - name: 冒烟测试 — P0 回归（预占泄漏 / 短装结案 / 改单丢仓库 / 出库放大）
        run: npm run smoke:p0-regression

      - name: 冒烟测试 — P1 回归（锁定容器避让 / 并货防护 / 并发占库无死锁）
        run: npm run smoke:p1-regression

      - name: 仓库级数据权限回归
        run: npm run smoke:warehouse-scope

      - name: PDA 设备会话回归（设备未绑定即拒绝作业）
        run: npm run smoke:pda-device-session

      - name: 冒烟测试 — 财务（收款核销 / 对账单 / 资金账户 / 费用报销）
        run: npm run smoke:finance

      - name: 冒烟测试 — 呆滞库存处置（建议→审批→处置，容器扣减+报废台账）
        run: npm run smoke:disposal

      - name: 冒烟测试 — 开票量校验（防多开票，累计开票≤应收/应付基准）
        run: npm run smoke:invoice-quota

      - name: 冒烟测试 — 已收款退货退款（红冲已收+账户出账+退货守卫联动）
        run: npm run smoke:refund-orders

      - name: 冒烟测试 — 会计凭证引擎（借贷平衡 / 资金勾稽 / 幂等）
        run: npm run smoke:accounting

      - name: 冒烟测试 — 会计期间结转/月结（期间锁定+结转链，2026-08-22 补入 CI）
        run: npm run smoke:accounting-period

      - name: 冒烟测试 — 打印任务过期/回收清理（队列防卡死）
        run: npm run test:print-purge

      - name: 冒烟测试 — 全局搜索仓库过滤（审计 A.4 守护，2026-08-22 新增）
        run: node tests/search-scope.smoke.test.js

      - name: 冒烟测试 — 用户改密/禁用 token 失效（安全语义守护，2026-08-22 新增）
        run: node tests/users-roles.smoke.test.js

      - name: 冒烟测试 — 报表数值正确性（与底层表核对，审计 4.6）
        run: npm run smoke:reports-values

      - name: 冒烟测试 — 出库信用复查（审计 4.8）
        run: npm run smoke:credit-outbound

      - name: 冒烟测试 — 采购审批环节（审计 4.7）
        run: npm run smoke:purchase-approval

      - name: 冒烟测试 — 多级审批流引擎（部门+审批流配置，P2-7）
        run: npm run smoke:approval-flow

      - name: 冒烟测试 — 超额放行申请单（申请→审批→占库自动放行，文档05 P2）
        run: npm run smoke:credit-override

      - name: 集成测试 — 库存主链路一致性（独立测试库）
        run: npm run test:integration
        env:
          DB_NAME: flowcube_integration_test
