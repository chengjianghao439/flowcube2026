# ============================================================
# 极序 Flow — 自动化测试门禁
#
# 触发：push 到 main、对 main 的 PR、手动触发
#
# 作用：在独立 MySQL 测试库上跑回归测试，作为发布前门禁。
#   绝不连接任何生产数据库（仅使用 service 容器里的临时库）。
#
# 内容：
#   0. static job：两端 ESLint + 前端 tsc（不需要 DB，与回归门禁并行）
#   1. 起 MySQL 8.0 service 容器（root/root，临时库）
#   2. 安装后端依赖、建库、跑迁移建表
#   3. smoke:mainline + smoke:concurrency-guards + smoke:sale-adjustment + smoke:p0-regression
#      （主链路 + 并发/回滚护栏 + 改单 + P0 回归）
#      p0-regression 锁死 2026-07 架构审计发现的五个「静默出错」缺陷：不报错、界面正常、
#      错误直接落进库存或账款，靠人工点测发现不了，必须由测试守住。
#      p1-regression 同源，覆盖并发一致性（锁定容器、死锁、上架丢失更新、热点索引）与
#      收货侧防错（容器采购归属与成本计价、超收双闸门与留痕、重复扫码防重）。
#   4. smoke:finance（收款核销 / 汇总对账单 / 资金账户 / 费用报销）
#      与 p0/p1 同性质，只是错的是钱不是货：账户余额与对账单已核销额都是「投影」，
#      一旦有人写成读余额→加减→写回就会静默错账，界面看不出来。
#   5. test:integration（采购入库 → 占库 → 调拨 → 盘点 → 退货 库存一致性，
#      使用独立测试库，避免与 smoke 数据相互污染）
#   任一测试失败则 job 失败。
# ============================================================
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  static:
    name: 静态检查（lint + 类型）
    runs-on: ubuntu-latest
    # 不需要 MySQL，和回归门禁并行跑，几分钟内就能给出反馈
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装后端依赖
        run: npm --prefix backend ci

      - name: 安装前端依赖
        run: npm --prefix frontend ci

      - name: ESLint — 后端
        run: npm --prefix backend run lint

      # 前端存量有 18 条 react-hooks/exhaustive-deps warning（见 frontend/eslint.config.js
      # 的说明）。这里只卡 error，不设 --max-warnings，避免为了过门禁去撒 eslint-disable。
      - name: ESLint — 前端
        run: npm --prefix frontend run lint

      # 后端是纯 JS 没有类型兜底，前端的类型检查就是这个项目唯一的类型门禁。
      # 必须用 tsconfig.app.json：根 tsconfig.json 是 files:[] 的空壳，永远 0 错误。
      - name: TypeScript — 前端类型检查
        run: ./frontend/node_modules/.bin/tsc -p frontend/tsconfig.app.json --noEmit

  regression:
    name: 回归门禁（smoke + 集成）
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flowcube_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: flowcube_test
      JWT_SECRET: flowcube_ci_test_jwt_secret_0123456789_abcdef
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
      # CI runner 无权限写 /var/www，桌面下载目录指到可写的临时目录
      APP_UPDATE_DOWNLOADS_DIR: /tmp/flowcube-downloads

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 安装后端依赖
        run: npm --prefix backend ci

      - name: 单元测试 — 标签几何/ZPL（纯函数，无需 DB）
        run: npm run test:label

      - name: 单元测试 — 打印调度策略/任务状态（纯函数，无需 DB）
        run: npm run test:print

      - name: 单元测试 — 前后端权限码一致性（纯静态，无需 DB）
        run: npm run test:permissions

      - name: 单元测试 — 会计科目映射一致性（映射↔seed↔常量，纯静态，无需 DB）
        run: npm run test:accounting

      - name: 等待 MySQL 就绪
        run: |
          set -e
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL ready"; exit 0
            fi
            echo "waiting for mysql... ($i)"; sleep 2
          done
          echo "MySQL did not become ready in time" >&2; exit 1

      - name: 创建测试数据库（smoke + 集成各一套）
        run: |
          set -e
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS flowcube_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS flowcube_integration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: 数据库迁移 — smoke 库
        run: npm --prefix backend run migrate

      - name: 数据库迁移 — 集成库
        run: npm --prefix backend run migrate
        env:
          DB_NAME: flowcube_integration_test

      - name: 冒烟测试 — 主链路（采购入库 / 打印 / 报表 / 导入导出 / 权限）
        run: npm run smoke:mainline

      - name: 冒烟测试 — 并发与回滚护栏（幂等 / 拆分 / 仓库任务取消）
        run: npm run smoke:concurrency-guards

      - name: 冒烟测试 — 销售单执行期改单（增减量 / PDA物理确认）
        run: npm run smoke:sale-adjustment

      - name: 冒烟测试 — P0 回归（预占泄漏 / 短装结案 / 改单丢仓库 / 出库放大）
        run: npm run smoke:p0-regression

      - name: 冒烟测试 — P1 回归（锁定容器避让 / 并货防护 / 并发占库无死锁）
        run: npm run smoke:p1-regression

      - name: 仓库级数据权限回归
        run: npm run smoke:warehouse-scope

      - name: PDA 设备会话回归（设备未绑定即拒绝作业）
        run: npm run smoke:pda-device-session

      - name: 冒烟测试 — 财务（收款核销 / 对账单 / 资金账户 / 费用报销）
        run: npm run smoke:finance

      - name: 冒烟测试 — 会计凭证引擎（借贷平衡 / 资金勾稽 / 幂等）
        run: npm run smoke:accounting

      - name: 集成测试 — 库存主链路一致性（独立测试库）
        run: npm run test:integration
        env:
          DB_NAME: flowcube_integration_test

  browser-smoke:
    name: 页面烟雾（Playwright）
    runs-on: ubuntu-latest
    needs: [regression]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flowcube_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: flowcube_test
      JWT_SECRET: flowcube_ci_test_jwt_secret_0123456789_abcdef
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
      APP_UPDATE_DOWNLOADS_DIR: /tmp/flowcube-downloads

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 安装后端依赖
        run: npm --prefix backend ci

      - name: 安装前端依赖
        run: npm --prefix frontend ci

      - name: 等待 MySQL 就绪并建库
        run: |
          set -e
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL ready"; break
            fi
            echo "waiting for mysql... ($i)"; sleep 2
          done
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS flowcube_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: 数据库迁移
        run: npm --prefix backend run migrate

      # 页面烟雾登录需要 smoke_admin（超管，role 1）。空库无此账号，
      # 直接插一条（bcrypt 哈希同 smokeTestKit 一致），等价于 prepareSmokeContext 的建号。
      - name: 建页面烟雾测试账号
        run: |
          node -e "
          const bcrypt = require('./backend/node_modules/bcryptjs');
          const mysql = require('./backend/node_modules/mysql2/promise');
          (async () => {
            const conn = await mysql.createConnection({ host:'127.0.0.1', port:3306, user:'root', password:'root', database:'flowcube_test' });
            const hash = bcrypt.hashSync('SmokeAdmin123!', 10);
            await conn.query(\"INSERT INTO sys_users (username, password, real_name, role_id, role_name, is_active) VALUES ('smoke_admin', ?, 'Smoke管理员', 1, '管理员', 1) ON DUPLICATE KEY UPDATE password=VALUES(password)\", [hash]);
            // 页面烟雾涉及仓库任务等页面，保证有基础数据：一个仓库、一个商品容器
            await conn.query(\"INSERT INTO inventory_warehouses (name, code) VALUES ('Smoke仓库', 'SMOKE-WH') ON DUPLICATE KEY UPDATE name=VALUES(name)\");
            await conn.query(\"INSERT INTO product_items (code, name, unit, sale_price_a) VALUES ('SMOKE-P001', 'Smoke商品', '个', 10) ON DUPLICATE KEY UPDATE name=VALUES(name)\");
            await conn.end();
          })().catch(e => { console.error(e.message); process.exit(1); });
          "

      # 前端构建产物由 preview 提供；/api 由 vite preview 的代理转发到 127.0.0.1:3000
      - name: 构建前端
        run: npm --prefix frontend run build

      - name: 启动后端 + 前端 preview
        run: |
          set -euo pipefail
          cd backend && (node index.js > /tmp/backend.log 2>&1 &) && cd ..
          cd frontend && (npx vite preview --port 5173 > /tmp/frontend.log 2>&1 &) && cd ..
          # 等待两端就绪
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1; then
              echo "backend + frontend ready"; exit 0
            fi
            echo "waiting for servers... ($i)"; sleep 2
          done
          echo "servers did not become ready" >&2
          tail -50 /tmp/backend.log >&2 || true
          tail -50 /tmp/frontend.log >&2 || true
          exit 1

      - name: 页面烟雾（Playwright）
        run: |
          set -euo pipefail
          SMOKE_BASE_URL="http://127.0.0.1:5173" \
          PAGE_SMOKE_BASE_URL="http://127.0.0.1:5173" \
          SMOKE_USERNAME="smoke_admin" \
          SMOKE_PASSWORD="SmokeAdmin123!" \
          PLAYWRIGHT_BROWSER_NAME=chromium \
          node scripts/smoke-pages.node.js
          SMOKE_BASE_URL="http://127.0.0.1:5173" \
          PAGE_SMOKE_BASE_URL="http://127.0.0.1:5173" \
          SMOKE_USERNAME="smoke_admin" \
          SMOKE_PASSWORD="SmokeAdmin123!" \
          PLAYWRIGHT_BROWSER_NAME=chromium \
          node scripts/smoke-reconciliation-jumps.node.js
