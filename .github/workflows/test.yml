      - name: 冒烟测试 — 报表数值正确性（与底层表核对，审计 4.6）
        run: npm run smoke:reports-values

      # 报表成本口径（2026-09-27 P2）：利润分析与 KPI 不得拿售价当成本；快照为空时区分
