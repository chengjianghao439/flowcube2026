name: Deploy Browser App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# 并发保护（2026-08-11 生产事故修复）：main 上连续多次 push 会触发多个 Deploy 并发在服务器
# 跑 docker compose up --build 互相抢容器。concurrency 让同一时间只跑一个 Deploy——
# 已开始的部署必须完成或走回退，不在应用切换中途取消；待运行队列保留最新提交。
concurrency:
  # 与 build-desktop / build-pda-apk 共用同一个 group：三者都要 SSH 到同一台服务器操作
  # （服务器端还有 flock 兜底，但那把锁只等 5 分钟，等不到就会被外层 timeout 强杀——
  #  2026-09-16 发 v0.9.17 时就这样失败过）。用同一个 group 让 GitHub 侧先排队，
  # 从源头上避免同时抢锁。
  group: flowcube-server-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 步骤预算：等检查 30 + 构建镜像 20 + 部署 105 = 155 分钟，留余量避免 job 级先被强杀。
    timeout-minutes: 165

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Wait for Tests and Security Scan on this commit
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-release-checks.js

      - name: Build application images on GitHub runner
        timeout-minutes: 20
        env:
          DEPLOY_IMAGE_OUTPUT: ${{ runner.temp }}/flowcube-images.tar.gz
        run: bash scripts/build-deploy-images.sh

      - name: Resolve deploy config
        id: deploy_config
        shell: bash
        env:
          ERP_ORIGIN_VAR: ${{ vars.VITE_ERP_PRODUCTION_ORIGIN }}
          SERVER_HOST_VAR: ${{ vars.FLOWCUBE_SERVER_HOST }}
          SERVER_USER_VAR: ${{ vars.FLOWCUBE_SERVER_USER }}
          SERVER_SSH_PORT_VAR: ${{ vars.FLOWCUBE_SERVER_SSH_PORT }}
          SERVER_APP_PATH_VAR: ${{ vars.FLOWCUBE_SERVER_APP_PATH }}
        run: |
          set -euo pipefail
          if node scripts/read-deploy-config.js >/tmp/flowcube-deploy-config.json 2>/tmp/flowcube-deploy-config.err; then
            {
              echo "erp_origin=$(node scripts/read-deploy-config.js erpOrigin)"
              echo "server_host=$(node scripts/read-deploy-config.js server.host)"
              echo "server_user=$(node scripts/read-deploy-config.js server.user)"
              echo "server_ssh_port=$(node scripts/read-deploy-config.js server.sshPort)"
              echo "server_app_path=$(node scripts/read-deploy-config.js server.appPath)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ERP_ORIGIN="${ERP_ORIGIN_VAR:-}"
          [ -n "$ERP_ORIGIN" ] || { echo "::error::缺少部署配置：设置 deploy/production.local.json 或 GitHub Variable VITE_ERP_PRODUCTION_ORIGIN"; cat /tmp/flowcube-deploy-config.err || true; exit 1; }
          SERVER_HOST="${SERVER_HOST_VAR:-$(node -e "const u=new URL(process.argv[1]); console.log(u.hostname)" "$ERP_ORIGIN")}"
          SERVER_USER="${SERVER_USER_VAR:-root}"
          SERVER_SSH_PORT="${SERVER_SSH_PORT_VAR:-22}"
          SERVER_APP_PATH="${SERVER_APP_PATH_VAR:-/opt/flowcube}"
          {
            echo "erp_origin=$ERP_ORIGIN"
            echo "server_host=$SERVER_HOST"
            echo "server_user=$SERVER_USER"
            echo "server_ssh_port=$SERVER_SSH_PORT"
            echo "server_app_path=$SERVER_APP_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Validate deploy inputs
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${{ steps.deploy_config.outputs.erp_origin }}" ] || { echo "::error::缺少 erp_origin"; exit 1; }
          [ -n "${{ steps.deploy_config.outputs.server_host }}" ] || { echo "::error::缺少 server_host"; exit 1; }
          [ -n "${{ steps.deploy_config.outputs.server_user }}" ] || { echo "::error::缺少 server_user"; exit 1; }
          [ -n "${{ steps.deploy_config.outputs.server_app_path }}" ] || { echo "::error::缺少 server_app_path"; exit 1; }
          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] || { echo "::error::缺少 Actions Secret: SSH_PRIVATE_KEY"; exit 1; }

      - name: Setup SSH agent
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE=~/.ssh/flowcube_ci_key
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add "$KEY_FILE"

      - name: Add SSH known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # 服务器 SSH 层存在**间歇性**不可用：2026-09-19 实测同一分钟内 ssh-keyscan 可能先失败、随后成功
          # （12:06 部署失败 → 12:2x rerun 成功 → 12:49 诊断又失败）。keyscan 默认 5 秒超时且不重试，单次失败
          # 就让整条部署/诊断链终止，表现为「Add SSH known_hosts: failure」——与网络不通无法区分、也无法自愈。
          # 现改为最多 5 次尝试（每次 -T 10 + timeout 20，只有拿到非空输出才算成功），全失败才终止并打印 stderr。
          HOST="${{ steps.deploy_config.outputs.server_host }}"
          PORT="${{ steps.deploy_config.outputs.server_ssh_port }}"
          keyscan_ok=0
          for attempt in 1 2 3 4 5; do
            if timeout 20 ssh-keyscan -T 10 -H -p "$PORT" "$HOST" > /tmp/keyscan.out 2>/tmp/keyscan.err && [ -s /tmp/keyscan.out ]; then
              cat /tmp/keyscan.out >> ~/.ssh/known_hosts
              keyscan_ok=1
              break
            fi
            echo "::warning::ssh-keyscan 第 ${attempt} 次失败（服务器 SSH 间歇不可用？），5 秒后重试"
            sleep 5
          done
          if [ "$keyscan_ok" != '1' ]; then
            echo "::error::ssh-keyscan 连续 5 次失败，无法建立 ~/.ssh/known_hosts"
            tail -5 /tmp/keyscan.err 2>/dev/null || true
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy backend and frontend on server
        # 预算：上传归档 ≤3600s（跨境带宽）+ 预检/脚本 ≤90s + server-update ≤2400s，合计约 102 分钟，留余量。
        timeout-minutes: 105
        shell: bash
        env:
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_LIMITED_USERNAME: ${{ secrets.SMOKE_LIMITED_USERNAME }}
          SMOKE_LIMITED_PASSWORD: ${{ secrets.SMOKE_LIMITED_PASSWORD }}
        run: |
          set -euo pipefail
          # 缺少任何一组验收凭据时，必须在 SSH、上传或迁移前停止。
          : "${SMOKE_USERNAME:?缺少 SMOKE_USERNAME}"
          : "${SMOKE_PASSWORD:?缺少 SMOKE_PASSWORD}"
          : "${SMOKE_LIMITED_USERNAME:?缺少 SMOKE_LIMITED_USERNAME}"
          : "${SMOKE_LIMITED_PASSWORD:?缺少 SMOKE_LIMITED_PASSWORD}"
          # 将新发布器带到旧 checkout，首次迁移清单必须早于 Git 更新。
          BOOTSTRAP_SCRIPT="/tmp/flowcube-pda-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          IMAGE_ARCHIVE="/tmp/flowcube-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          IMAGE_SHA256="$(sha256sum "$RUNNER_TEMP/flowcube-images.tar.gz" | cut -d' ' -f1)"
          # 上传前预检临时目录与应用目录，保留余量；不触发 Docker 全盘扫描。
          # **余量不足必须自解释**：原先写的是 `test "$(df -Pm ...)" -ge 6144`，余量不够时 ssh 只返回
          # 1、一行输出都没有，与「SSH 连不上/密钥失效」在日志里长得完全一样。2026-09-19 11:04 起
          # 连续 3 轮部署都以「##[endgroup] 之后 3~4 秒静默 exit 1」失败，日志里没有任何可诊断信息，
          # 事后才推断出是服务器磁盘低于 6 GiB。现在先打印实际余量，再据此判定并给出可执行的处置提示。
          DISK_USAGE="$(timeout -k 5 30 ssh -o ConnectTimeout=20 -p "${{ steps.deploy_config.outputs.server_ssh_port }}" \
            "${{ steps.deploy_config.outputs.server_user }}@${{ steps.deploy_config.outputs.server_host }}" \
            "df -Pm /tmp '${{ steps.deploy_config.outputs.server_app_path }}' | awk 'NR>1 {print \$6, \$4 \"MB\"}'")" \
            || { echo "::error::无法读取服务器磁盘余量（SSH 连接或认证失败），部署中止"; exit 1; }
          echo "服务器可用空间（挂载点 可用）："
          printf '%s\n' "$DISK_USAGE"
          printf '%s\n' "$DISK_USAGE" | awk '
            NF < 2 { print "::error::服务器磁盘预检没有拿到可用空间，部署中止"; bad = 1; next }
            { mb = $NF; sub(/MB$/, "", mb)
              if (mb + 0 < 6144) { printf "::error::%s 可用 %s，低于部署预检下限 6144MB：请先清理服务器磁盘再重跑（不得清除回退镜像）\n", $1, $NF; bad = 1 } }
            END { exit bad ? 1 : 0 }'
          # 上传时限 3600 秒（2026-09-21 从 1800 放宽）。原先要求与 server-update.sh 里
          # docker load 的 1800 秒对齐，理由是「同一个根因（服务器慢盘）上的两个环节」——
          # 那条理由对 load 成立，对上传不成立：上传慢是 **GitHub runner 到阿里云的跨境带宽**，
          # 与服务器磁盘无关。实测本机到服务器 50MB 秒传，而 runner 传 400MB 镜像归档连续
          # 三次都卡在 1800 秒被强杀（exit 137），线上仍是旧版。两者根因不同，因此分别设限：
          # 上传 3600 秒，load 保持 1800 秒。若日后 runner 侧带宽稳定，可再收回。
          timeout -k 10 3600 scp -o ConnectTimeout=20 -P "${{ steps.deploy_config.outputs.server_ssh_port }}" "$RUNNER_TEMP/flowcube-images.tar.gz" \
            "${{ steps.deploy_config.outputs.server_user }}@${{ steps.deploy_config.outputs.server_host }}:$IMAGE_ARCHIVE"
          timeout -k 5 60 scp -o ConnectTimeout=20 -P "${{ steps.deploy_config.outputs.server_ssh_port }}" scripts/publish-pda.sh \
            "${{ steps.deploy_config.outputs.server_user }}@${{ steps.deploy_config.outputs.server_host }}:$BOOTSTRAP_SCRIPT"
          # %q 逐项转义远程环境，口令中的引号/美元符号不能改变远程脚本。
          printf -v REMOTE_COMMAND '%q ' env \
            "SERVER_APP_PATH=${{ steps.deploy_config.outputs.server_app_path }}" \
            "EXPECTED_COMMIT=$GITHUB_SHA" "BOOTSTRAP_SCRIPT=$BOOTSTRAP_SCRIPT" \
            "DEPLOY_IMAGE_ARCHIVE=$IMAGE_ARCHIVE" "DEPLOY_IMAGE_SHA256=$IMAGE_SHA256" \
            "DEPLOY_PUBLIC_ORIGIN=${{ steps.deploy_config.outputs.erp_origin }}" \
            "SMOKE_USERNAME=$SMOKE_USERNAME" "SMOKE_PASSWORD=$SMOKE_PASSWORD" \
            "SMOKE_LIMITED_USERNAME=$SMOKE_LIMITED_USERNAME" "SMOKE_LIMITED_PASSWORD=$SMOKE_LIMITED_PASSWORD" bash -s
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=20 \
            -p "${{ steps.deploy_config.outputs.server_ssh_port }}" "${{ steps.deploy_config.outputs.server_user }}@${{ steps.deploy_config.outputs.server_host }}" "$REMOTE_COMMAND" <<'EOF'
          set -euo pipefail
          cd "$SERVER_APP_PATH"
          exec 9>/tmp/flowcube-deploy.lock
          # 等锁上限与 PDA 发布（build-pda-apk.yml）保持一致：一次完整部署可能十几分钟，
          # 5 分钟会在与其它发布流程错峰时抢锁超时（2026-09-16 v0.9.17 即为此失败）。
          flock -w 1800 9
          trap 'rm -f "$BOOTSTRAP_SCRIPT" "$DEPLOY_IMAGE_ARCHIVE"' EXIT
          if [ ! -f backend/apk/published-version.json ] && [ -f backend/apk/version.json ] && [ -f backend/apk/app-release.apk ]; then
            bash "$BOOTSTRAP_SCRIPT" backend/apk/app-release.apk backend/apk/version.json backend/apk
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "==> 检测到服务器 Git 工作区存在未解决冲突，重置到当前发布提交"
            git reset --hard HEAD
          fi
          timeout -k 5 120 git fetch origin main
          git reset --hard "$EXPECTED_COMMIT"
          # 发布门禁（release-gate）随部署执行：页面烟雾 + 对账回跳。凭据由 GitHub Secrets 注入，
          # 服务器不再 SKIP_RELEASE_GATE=1——坏版本（渲染错误/路由失效）会在部署时被当场拦下。
          # 600 秒清理窗口覆盖两轮健康等待(420s)、Docker 管理/清理和失败通知。
          FLOWCUBE_DEPLOY_TIMEOUT_GROUP=1 DEPLOY_LOCK_FD=9 SKIP_GIT_PULL=1 timeout -k 600 2400 bash scripts/server-update.sh
          EOF

      - name: Remove this run's temporary upload
        if: always() && steps.deploy_config.outputs.server_host != ''
        timeout-minutes: 2
        shell: bash
        run: |
          timeout -k 5 60 ssh -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -p "${{ steps.deploy_config.outputs.server_ssh_port }}" "${{ steps.deploy_config.outputs.server_user }}@${{ steps.deploy_config.outputs.server_host }}" \
            "rm -f /tmp/flowcube-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz /tmp/flowcube-pda-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh" \
            || echo '::warning::临时上传清理失败，请检查本次 run 对应的 /tmp 文件'
