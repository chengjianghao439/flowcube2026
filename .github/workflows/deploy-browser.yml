# Manual release only. No push, workflow_run or workflow_call publication.
name: Deploy Browser App
'on':
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 必须填写 main 历史中完整的 40 位 SHA；不接受分支、标签或短 SHA。
        required: true
        type: string
      approval_comment_id:
        description: 老大在 GitHub 回复 发 加完整 SHA 的评论 ID。
        required: true
        type: string
      backup_comment_id:
        description: 同一主题内，运维先提交的备份就绪评论 ID。
        required: true
        type: string
permissions:
  contents: read
  actions: read
  issues: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  resolve-release-target:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      main_sha: ${{ github.workflow_sha }}
      artifact_id: ${{ steps.checks.outputs.artifact-id }}
    steps:
      - name: Checkout immutable trusted release tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate immutable release target
        id: target
        env:
          RELEASE_MANUAL_ONLY: '1'
          RELEASE_CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: node scripts/resolve-release-target.cjs
      - name: Verify GitHub approval, Tests and actual npm audit jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
          BACKUP_COMMENT_ID: ${{ inputs.backup_comment_id }}
          RELEASE_CHECKS_OUTPUT: checks.json
        run: node scripts/manual-release/verify-gates.cjs
      - name: Retain verified gate evidence
        id: checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manual-release-checks
          path: checks.json
          retention-days: 7
          if-no-files-found: error
  build:
    needs: resolve-release-target
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - name: Checkout selected application SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve-release-target.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Checkout immutable trusted release tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Download verified gate evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.resolve-release-target.outputs.artifact_id }}
          path: gate
          merge-multiple: true
      - name: Build application images on GitHub runner
        env:
          GITHUB_SHA: ${{ needs.resolve-release-target.outputs.sha }}
          FLOWCUBE_BUILD_ROOT: ${{ github.workspace }}/source
          DEPLOY_IMAGE_OUTPUT: ${{ runner.temp }}/payload/images.tar.gz
          FLOWCUBE_IMAGE_REPORT_DIR: ${{ runner.temp }}/payload
        run: |-
          mkdir -p "$RUNNER_TEMP/payload"
          bash trusted/scripts/build-deploy-images.sh
          bash trusted/scripts/generate-image-sbom.sh "$DEPLOY_IMAGE_OUTPUT"
      - name: Create full immutable release envelope
        env:
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
        run: >-
          python3 -B trusted/scripts/manual-release/make-bundle.py browser source "$RUNNER_TEMP/payload" gate/checks.json
          "$RUNNER_TEMP/release.tar"
      - name: Retain full bundle, SBOM, provenance and digest manifest
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-release-bundle
          path: ${{ runner.temp }}/release.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs:
      - resolve-release-target
      - build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 215
    environment: manual-release
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    concurrency:
      group: flowcube-server-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout immutable trusted release tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Recheck live GitHub gates and authenticated approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
          APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
          BACKUP_COMMENT_ID: ${{ inputs.backup_comment_id }}
          RELEASE_CHECKS_OUTPUT: current-checks.json
        run: node scripts/manual-release/verify-gates.cjs
      - name: Download this run exact release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: bundle
          merge-multiple: true
      - name: Verify target SHA, locks and full bundle before secrets
        env:
          TARGET_SHA: ${{ needs.resolve-release-target.outputs.sha }}
        run: python3 -B scripts/manual-release/verify-local.py bundle/release.tar verified current-checks.json
      - name: Direct restricted SSH transfer from GitHub runner
        env:
          FLOWCUBE_SSH_HOST: ${{ vars.FLOWCUBE_SERVER_HOST }}
          FLOWCUBE_SSH_PORT: ${{ vars.FLOWCUBE_SERVER_SSH_PORT }}
          FLOWCUBE_RELEASE_USER: ${{ vars.FLOWCUBE_RELEASE_USER }}
          FLOWCUBE_SSH_KNOWN_HOSTS: ${{ vars.FLOWCUBE_SSH_KNOWN_HOSTS }}
          FLOWCUBE_RELEASE_SSH_KEY: ${{ secrets.FLOWCUBE_RELEASE_SSH_KEY }}
        run: python3 -B scripts/manual-release/send-bundle.py bundle/release.tar
