name: Build Images (artifact)

# 只构建发布镜像并留档为 artifact，**不接触生产服务器**。
#
# 为什么需要它（2026-09-21 事故）：
#   CI runner 在 Azure eastus2，到阿里云生产机的跨境 scp 吞吐会塌陷。同一天实测：
#     runner → 服务器      27 KB/s   （400MB 归档需 4.3 小时；而 Deploy 的上传上限 3600 秒
#                                      最多传 97MB，所以连续多轮都卡在 timeout 被强杀 exit 137）
#     本机(代理) → GitHub  3.66 MB/s
#     本机       → 服务器  7.7 MB/s
#   把「构建」与「投递」解耦后，投递段可以换成快链路：
#     1) 手动触发本 workflow，得到 flowcube-images artifact
#     2) 本机下载（走代理）后 scp 到服务器（约 1 分钟）
#     3) 触发 deploy-browser.yml 的 workflow_dispatch，填 preloaded_image_archive / _sha256
#   镜像仍然**只由 GitHub Actions 构建**——scripts/build-deploy-images.sh 会直接拒绝
#   非 Actions 环境，这条约束没有被绕过。部署侧继续校验归档 sha256 与
#   镜像 revision == EXPECTED_COMMIT，因此本 workflow 只是搬运，不是放行。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 独立并发组：本 workflow 不 SSH 到服务器，不应占用 flowcube-server-deploy
  # （否则会把真正的部署挤成 pending，2026-09-16 发 v0.9.17 就是这样被取消过）。
  group: build-images-ci
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Build application images
        timeout-minutes: 25
        env:
          DEPLOY_IMAGE_OUTPUT: ${{ runner.temp }}/flowcube-images.tar.gz
        run: |
          set -euo pipefail
          bash scripts/build-deploy-images.sh
          echo "==> 归档信息（部署侧会按同一摘要校验）"
          ls -lh "$DEPLOY_IMAGE_OUTPUT"
          sha256sum "$DEPLOY_IMAGE_OUTPUT" | tee "$DEPLOY_IMAGE_OUTPUT.sha256"
          echo "==> 本次镜像 revision（必须等于部署时的 EXPECTED_COMMIT）"
          echo "$GITHUB_SHA"

      - name: Upload image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flowcube-images
          path: |
            ${{ runner.temp }}/flowcube-images.tar.gz
            ${{ runner.temp }}/flowcube-images.tar.gz.sha256
          retention-days: 3
