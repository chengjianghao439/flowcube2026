name: Security Scan
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: 0 22 * * 0
permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  gitleaks:
    name: Gitleaks — 敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Gitleaks license
        id: license
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: if [ -n "$GITLEAKS_LICENSE" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
        if: steps.license.outputs.enabled == 'true'
      - name: Fallback gitleaks (Docker)
        if: steps.license.outputs.enabled != 'true'
        run: |-
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-output"
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges --network=none \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/gitleaks-output:/out" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect \
            --source=/repo --config=/repo/.gitleaks.toml \
            --report-format=sarif --report-path=/out/gitleaks-report.sarif --redact
      - name: Upload Gitleaks SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.license.outputs.enabled == 'true' && 'gitleaks-report.sarif' || format('{0}/gitleaks-output/gitleaks-report.sarif', runner.temp) }}
          category: gitleaks
      - name: Gitleaks Summary
        if: always()
        run: |
          if [ -f "$REPORT_FILE" ]; then
            ISSUES=$(jq -er '.runs[0].results | if type == "array" then length else error("invalid results") end' "$REPORT_FILE")
            echo "## Gitleaks 扫描结果" >> "$GITHUB_STEP_SUMMARY"
            echo "发现 **$ISSUES** 个敏感信息问题" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Gitleaks 扫描结果" >> "$GITHUB_STEP_SUMMARY"
            echo "未生成可读取的 SARIF 报告，请核对 Gitleaks 扫描步骤；不能据此判定零泄露。" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          REPORT_FILE: ${{ steps.license.outputs.enabled == 'true' && 'gitleaks-report.sarif' || format('{0}/gitleaks-output/gitleaks-report.sarif', runner.temp) }}
  npm-audit:
    name: npm audit — 依赖漏洞扫描
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - backend
          - frontend
          - desktop
          - scripts/browser-smoke
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies (${{ matrix.target }})
        run: npm ci --prefix ${{ matrix.target }} --ignore-scripts --no-audit
      - name: Audit dependencies and enforce result integrity
        timeout-minutes: 5
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm --prefix ${{ matrix.target }} audit --json --fetch-timeout=30000 --fetch-retries=1 > audit-report.json
          AUDIT_EXIT=$?
          set -e
          node scripts/check-npm-audit.js audit-report.json "$AUDIT_EXIT"
  sensitive-files:
    name: 敏感文件检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check for tracked secrets
        run: |
          ISSUES=0
          echo "## 敏感文件检查" >> "$GITHUB_STEP_SUMMARY"
          for pattern in "*.pem" "*.key" "id_rsa" "id_ed25519" "*.env" "flowcube_backup.sql"; do
            result=$(git ls-files "$pattern" 2>/dev/null || true)
            if [ -n "$result" ]; then
              echo "🔴 敏感文件被跟踪: $result" >> "$GITHUB_STEP_SUMMARY"
              ISSUES=$((ISSUES+1))
            fi
          done
          if [ "$ISSUES" -eq 0 ]; then
            echo "未发现被跟踪的敏感文件 ✅" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$ISSUES"
