services:
  mysql:
    image: mysql:8.0
    container_name: flowcube-mysql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      # 【时区固化 2026-08-27】MySQL 服务端时区 = 北京时间。官方 mysql:8.0 镜像
      # 默认 UTC，NOW()/CURRENT_TIMESTAMP 默认值会与后端连接池 timezone=+08:00
      # 的读写字面量差 8 小时。TZ 环境变量对官方镜像的 mysqld 生效（读 /etc/localtime
      # 的 system_time_zone；MySQL 的 session time_zone 默认继承 system）。
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      # 2026-08-21 审计修复：不再挂载迁移目录到 docker-entrypoint-initdb.d——
      # 空数据卷首次启动会执行全部迁移（不记录 db_migrations），随后 server-update.sh
      # 的显式 migrate 再跑一遍，ALTER TABLE 会因 Duplicate column 失败。
      # 迁移只由 server-update.sh 的显式步骤负责（见 scripts/server-update.sh）。
      # 慢查询日志与连接数配置（P2-14）：只读挂载，不覆盖默认配置目录
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/slowlog.cnf:ro
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: flowcube-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: flowcube-backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # 【时区固化 2026-08-27】业务时间唯一权威时区 = 北京时间。
      # Dockerfile.backend 已设 ENV TZ，这里显式再声明一眼可读；mysql 容器同名，
      # 使 NOW()/CURRENT_TIMESTAMP 默认值也与 +08:00 连接池读写一致。
      TZ: Asia/Shanghai
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      CORS_REFLECT: ${CORS_REFLECT:-0}
      CORS_ALLOW_NULL_ORIGIN: ${CORS_ALLOW_NULL_ORIGIN:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      DINGTALK_ALERT_WEBHOOK: ${DINGTALK_ALERT_WEBHOOK:-}
      DINGTALK_ALERT_SECRET: ${DINGTALK_ALERT_SECRET:-}
      APP_UPDATE_DOWNLOADS_DIR: /var/www/flowcube-downloads
      # 日志集中检索（P2-12）：起 observability profile 后填 loki 服务地址即可接入
      LOKI_URL: ${LOKI_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # 桌面发布目录只允许指向 canonical host path；backend/downloads 已废弃，禁止作为默认 fallback。
      - ${FLOWCUBE_DOWNLOADS_DIR:-/var/www/flowcube-downloads}:/var/www/flowcube-downloads
      # PDA 自动更新包从服务器工作区 backend/apk 发布；挂载后 CI 上传新 APK 可被后端立即读取。
      - ./backend/apk:/app/apk:ro

  frontend:
    image: flowcube-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: flowcube-frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      - backend
    ports:
      # 80 由宿主 Caddy 独占（ACME 证书验证 + HTTP→HTTPS 重定向），容器内 nginx 挪到 8080 仅回环暴露
      - "127.0.0.1:8080:80"
    volumes:
      # nginx 只暴露 canonical downloads root，下游路径为 /latest.json、/versions/、/current/。
      - ${FLOWCUBE_DOWNLOADS_DIR:-/var/www/flowcube-downloads}:/usr/share/nginx/downloads:ro

  # 日志集中检索（P2-12）：Grafana Loki + 可选 grafana。用 observability profile 隔离——
  # 默认 docker compose up 不会起它们（不影响现有部署）；需要时显式：
  #   docker compose --profile observability up -d
  # 然后给 backend 配 LOKI_URL（见 backend/.env 的 LOKI_URL），warn/error 日志即自动推送。
  loki:
    image: grafana/loki:3.2.1
    container_name: flowcube-loki
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    container_name: flowcube-grafana
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - "127.0.0.1:3101:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # 密码非必填（observability profile 默认不启用；起 profile 前请务必设置强密码）——
      # 用默认值避免阻断主部署链路（docker compose 对所有服务做变量插值，必填会卡死 compose up）
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-flowcube-admin-change-me}
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  mysql_data:
  loki_data:
  grafana_data:
