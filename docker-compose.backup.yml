# 可选异地备份。先配置获准的 rclone remote，再单独启动该 Compose 文件。
# docker compose -f docker-compose.backup.yml up -d rclone-sync  # 周期复制
# docker compose -f docker-compose.backup.yml run --rm rclone-sync once  # 单次复制
services:
  rclone-init:
    profiles: [manual]
    extends:
      service: rclone-sync
    restart: "no"
    command: ["once"]
    healthcheck:
      disable: true

  rclone-sync:
    image: rclone/rclone:latest
    restart: unless-stopped
    volumes:
      - ${BACKUP_DIR:-/opt/flowcube/backups}:/backups:ro
      - ${RCLONE_CONFIG:-/root/.config/rclone}:/config/rclone:ro
      - ${BACKUP_DIR:-/opt/flowcube/backups}/.offsite-status:/status
      - ./scripts/offsite-backup.sh:/backup-tools/offsite-backup.sh:ro
    environment:
      RCLONE_REMOTE: ${RCLONE_REMOTE:-backup:flowcube}
      OFFSITE_INTERVAL_SECONDS: ${OFFSITE_INTERVAL_SECONDS:-21600}
      OFFSITE_MAX_AGE_SECONDS: ${OFFSITE_MAX_AGE_SECONDS:-46800}
      OFFSITE_MAX_PAIR_AGE_SECONDS: ${OFFSITE_MAX_PAIR_AGE_SECONDS:-129600}
    entrypoint: ["sh", "/backup-tools/offsite-backup.sh"]
    command: ["loop"]
    healthcheck:
      test: ["CMD", "sh", "/backup-tools/offsite-backup.sh", "health"]
      interval: 15m
      timeout: 15s
      start_period: 1h
      retries: 2
